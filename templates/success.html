<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Processing Complete</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            text-align: center;
            padding: 50px 20px;
            margin: 0;
        }
        .container {
            max-width: 650px;
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            margin: 0 auto;
        }
        h1 { color: #2ecc71; margin-bottom: 10px; }
        p { color: #666; margin-bottom: 30px; }
        .image-preview {
            max-width: 100%;
            max-height: 400px;
            border-radius: 8px;
            border: 1px solid #ddd;
            margin-bottom: 35px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        /* Flexbox structure keeps the action button grid aligned perfectly */
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-width: 400px;
            margin: 0 auto;
        }
        /* 
           MATCHING LOGIC STYLES:
           These properties mirror a standard high-utility submission element setup.
        */
        .btn {
            display: block;
            width: 100%;
            padding: 14px 20px;
            box-sizing: border-box;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
            text-align: center;
            transition: background-color 0.15s ease, transform 0.1s ease;
        }
        /* Primary actions (Like your main page submit action background setup) */
        .btn-primary { 
            background-color: #3498db; 
            color: white; 
        }
        .btn-primary:hover { 
            background-color: #2980b9; 
        }
        .btn-primary:active {
            transform: scale(0.98);
        }
        /* Accent Laser file action variant */
        .btn-accent {
            background-color: #e67e22;
            color: white;
        }
        .btn-accent:hover {
            background-color: #d35400;
        }
        .btn-accent:active {
            transform: scale(0.98);
        }
        /* Secondary home actions fallback */
        .btn-secondary { 
            background-color: #e2e8f0; 
            color: #4a5568; 
        }
        .btn-secondary:hover { 
            background-color: #cbd5e1; 
        }
        .btn-secondary:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Processing Complete!</h1>
        <p>Your engraving assets have been generated and optimized successfully.</p>
        
        <!-- Dynamic view-image preview loader -->
        <img class="image-preview" src="/view-image/{{ task_id }}" alt="Processed Result Preview">

        <div class="btn-group">
            <!-- Main Vector Asset Download -->
            <a href="/download/{{ task_id }}" class="btn btn-primary">Download Processed SVG</a>
            
            <!-- LightBurn Layout Download -->
            <a href="/download-lbrn2/{{ task_id }}" class="btn btn-accent">Download LightBurn File (.lbrn2)</a>
            
            <!-- Process reset navigation trigger -->
            <a href="/" class="btn btn-secondary">Process Another Image</a>
        </div>
    </div>
<!-- Inside templates/success.html, add this at the very bottom -->
<script>
    // Extract the task ID passed into the template by Flask
    const taskId = "{{ task_id }}";

    // The moment the success page finishes loading, trigger the file download streams.
    // Because this happens on a page transition context layout, browsers allow it cleanly!
    window.addEventListener('DOMContentLoaded', () => {
        console.log("Success page mounted. Initializing download streams...");
        
        // Trigger main vector asset download automatically
        const mainDownload = document.createElement("a");
        mainDownload.href = "/download/" + taskId;
        document.body.appendChild(mainDownload);
        mainDownload.click();
        document.body.removeChild(mainDownload);
    });
</script>
</body>
</html>
