<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Processing Image</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .terminal-box {
            background: #1e1e1e;
            color: #00ff00;
            font-family: 'Courier New', Courier, monospace;
            padding: 20px;
            border-radius: 8px;
            text-align: left;
            /* width: 90%; */
            /* max-width: 600px; */
            /* height: 300px; */
            overflow-y: auto;
            box-shadow: inset 0 0 15px #000, 0 8px 30px rgba(0,0,0,0.15);
            width: 75%;           /* Fills 95% of the screen width */
            max-width: 1200px;    /* Optional: Prevents it from getting too wide on massive screens */
            height: 75vh;         /* Fills 90% of the screen height */
            margin: 2vh auto;     /* Centers the box vertically and horizontally */            
        }
        .log-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .log-item {
            margin-bottom: 8px;
            line-height: 1.4;
            word-break: break-all;
        }
        .log-prefix {
            color: #666;
            margin-right: 8px;
            user-select: none;
        }
    </style>
</head>
<body>
    
        <div class="terminal-box" id="terminal">
            <ul class="log-list" id="log-container">
                <li class="log-item"><span class="log-prefix">$</span>Connecting to script pipeline...</li>
            </ul>
        </div>
        <!-- Right Side: Live Processed Files History -->
        <aside class="downloads-sidebar">
            <h2>Processed Files</h2>
            <ul id="download-list" class="download-list">
                <!-- Items will be appended here dynamically via JS -->

                    
                <!-- <li class="download-item" id="task-123">
                    <span>report_123.csv</span>
                    <a href="'/downloads/<task_id> class="download-link">Download</a>
                </li> -->
            </ul>
        </aside>

<script>
    const taskId = "{{ task_id }}";
    const logContainer = document.getElementById("log-container");
    const terminalBox = document.getElementById("terminal");
    
    let logIndex = 0; 

    function appendLogMessage(message) {
        const cleanMessage = message ? message.trim() : "";
        if (!cleanMessage || cleanMessage === "Waiting to start...") {
            return; 
        }

        const li = document.createElement("li");
        li.className = "log-item";
        li.innerHTML = `<span class="log-prefix">$</span>${cleanMessage}`;
        logContainer.appendChild(li);
        
        terminalBox.scrollTop = terminalBox.scrollHeight;
    }

    // Start checking logs immediately, but handle connection lags robustly
    const checkStatus = setInterval(async () => {
        try {
            const response = await fetch(`/task-status/${taskId}`);
            
            // FIX 1: If the server is busy/booting, don't crash or freeze. Log it and retry.
            if (!response.ok) {
                console.warn(`Server booting task or unavailable. Status: ${response.status}`);
                return; 
            }

            const data = await response.json();

            // FIX 2: Ensure data parsing fallback arrays exist to prevent undefined breaks
            const currentLogs = data.logs || [];

            // Process and append new logs
            if (currentLogs.length > logIndex) {
                const newLines = currentLogs.slice(logIndex);
                newLines.forEach((logMessage) => {
                    appendLogMessage(logMessage);
                });
                logIndex = currentLogs.length;
            }
   
            // Evaluate completion statuses cleanly after logs are checked
            if (data.status === "completed") {
                clearInterval(checkStatus);
                appendLogMessage("Task completed successfully! Redirecting to dashboard...");
                setTimeout(() => {
                    const listContainer = document.getElementById('download-list');

                    // 1. Create a list item structure for this specific task
                    const listItem = document.createElement('li');
                    listItem.className = 'download-item';
                    listItem.id = `task-${taskId}`; // Unique ID to find it later

                    // 2. Add placeholder contents while processing
                    listItem.innerHTML = `
                        <span class="file-name">Processing task ${taskId}...</span>
                        <span class="status-tag" style="background: #ffeeba; color: #856404;">Pending</span>
                    `;

                    try {
                        // 1. Fetch the download details from your endpoint
                        const dl_list = await fetch(`/downl-list/${taskId}`);
                        
                        // 2. Parse the response into a readable JavaScript object
                        const fileData = await dl_list.json(); 
                        
                        // 3. Extract the variables sent by your Flask backend
                        // (Adjust 'filename' to match whatever key your JSON uses, e.g., fileData.name)
                        const fileName = fileData.files; 

                        // 4. Target your right-hand sidebar list container
                        const listContainer = document.getElementById('download-list');

                        // 5. Create the new list item element
                        const listItem = document.createElement('li');
                        listItem.className = 'download-item';

                        // 6. Populate the list item with your backend variables
                        for file in files:
                            listItem.innerHTML = `
                                <span>${file}</span>
                                <a href="${file}" class="download-link" download>Download</a>
                        `;

                        // 7. Inject the item at the very top of your processed files list
                        listContainer.insertBefore(listItem, listContainer.firstChild);

                    } catch (error) {
                        console.error("Failed to fetch download details:", error);
                    }




                    window.location.href = "/success/" + taskId;
                }, 500);
            }
            else if (data.status === "failed") {
                clearInterval(checkStatus);
                appendLogMessage(`CRITICAL FAILURE: ${data.error || 'Check server logs'}`);
                const errorLine = logContainer.lastChild;
                if (errorLine) errorLine.style.color = "#ff3333";
            }
            
        } catch (err) {
            // FIX 3: Catch local network disconnects cleanly without killing the timer
            console.error("Polling interval encountered a connection drop:", err);
        }
    }, 1000); // Check every 1000ms from the very beginning

</script>

</body>
</html>
