<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Processing Image</title>
    <style>
    body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background-color: #f4f7f6;
        display: flex;
        flex-direction: column; /* Stacks the terminal box and the list vertically */
        justify-content: center;
        align-items: center;
        min-height: 100vh;      /* Prevents content cutting off if the page gets tall */
        margin: 0;
        padding: 40px 20px;     /* Adds padding at the top and bottom of the screen */
    }

    .terminal-box {
        background: #1e1e1e;
        color: #00ff00;
        font-family: 'Courier New', Courier, monospace;
        padding: 20px;
        border-radius: 8px;
        text-align: left;
        overflow-y: auto;
        box-shadow: inset 0 0 15px #000, 0 8px 30px rgba(0,0,0,0.15);
        width: 100%;           
        max-width: 1200px;    
        height: 50vh;         
        margin: 0 auto 30px auto; /* Centers the box and adds a 30px gap UNDER it */            
    }
        .log-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .log-item {
            margin-bottom: 8px;
            line-height: 1.4;
            word-break: break-all;
        }
        .log-prefix {
            color: #666;
            margin-right: 8px;
            user-select: none;
        }
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-width: 400px;
            margin: 0 auto;
        }
        /* 
           MATCHING LOGIC STYLES:
           These properties mirror a standard high-utility submission element setup.
        */
        .btn {
            display: block;
            width: 100%;
            padding: 14px 20px;
            box-sizing: border-box;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
            text-align: center;
            transition: background-color 0.15s ease, transform 0.1s ease;
        }
        /* Primary actions (Like your main page submit action background setup) */
        .btn-primary { 
            background-color: #3498db; 
            color: white; 
        }
        .btn-primary:hover { 
            background-color: #2980b9; 
        }
        .btn-primary:active {
            transform: scale(0.98);
        }
        /* Accent Laser file action variant */
        .btn-accent {
            background-color: #e67e22;
            color: white;
        }
        .btn-accent:hover {
            background-color: #d35400;
        }
        .btn-accent:active {
            transform: scale(0.98);
        }
        /* Secondary home actions fallback */
        .btn-secondary { 
            background-color: #e2e8f0; 
            color: #4a5568; 
        }
        .btn-secondary:hover { 
            background-color: #cbd5e1; 
        }
        .btn-secondary:active {
            transform: scale(0.98);
        }        
    </style>
</head>
<body>
    
        <div class="terminal-box" id="terminal">
            <ul class="log-list" id="log-container">
                <li class="log-item"><span class="log-prefix">$</span>Connecting to script pipeline...</li>
            </ul>
        </div>
        <!-- Right Side: Live Processed Files History -->
        <aside class="downloads-sidebar">
            <h2>Processed Files</h2>
            <ul id="download-list" class="download-list">
                
                <!-- Check if the files variable exists and has items -->
            <div class="btn-group">
                <a href="/download/{{ task_id }}" class="btn btn-accent">Download SVG file)</a>                
                <a href="/download-lbrn2/{{ task_id }}" class="btn btn-accent">Download LightBurn File (.lbrn2)</a>
                <a href="/" class="btn btn-secondary">Process Another Image</a>
            </div>                
                
            </ul>
        </aside>

<script>
    const taskId = "{{ task_id }}";
    const logContainer = document.getElementById("log-container");
    const terminalBox = document.getElementById("terminal");
    
    let logIndex = 0; 

    function appendLogMessage(message) {
        const cleanMessage = message ? message.trim() : "";
        if (!cleanMessage || cleanMessage === "Waiting to start...") {
            return; 
        }

        const li = document.createElement("li");
        li.className = "log-item";
        li.innerHTML = `<span class="log-prefix">$</span>${cleanMessage}`;
        logContainer.appendChild(li);
        
        terminalBox.scrollTop = terminalBox.scrollHeight;
    }

    // Start checking logs immediately, but handle connection lags robustly
    const checkStatus = setInterval(async () => {
        try {
            const response = await fetch(`/task-status/${taskId}`);
            
            // FIX 1: If the server is busy/booting, don't crash or freeze. Log it and retry.
            if (!response.ok) {
                console.warn(`Server booting task or unavailable. Status: ${response.status}`);
                return; 
            }

            const data = await response.json();

            // FIX 2: Ensure data parsing fallback arrays exist to prevent undefined breaks
            const currentLogs = data.logs || [];

            // Process and append new logs
            if (currentLogs.length > logIndex) {
                const newLines = currentLogs.slice(logIndex);
                newLines.forEach((logMessage) => {
                    appendLogMessage(logMessage);
                });
                logIndex = currentLogs.length;
            }
   
            // Evaluate completion statuses cleanly after logs are checked
            if (data.status === "completed") {
                clearInterval(checkStatus);
                appendLogMessage("Task completed successfully! Redirecting to dashboard...");
                setTimeout(( ) => {
                    window.location.href = "/success/" + taskId;
                }, 500);
            }
            else if (data.status === "failed") {
                clearInterval(checkStatus);
                appendLogMessage(`CRITICAL FAILURE: ${data.error || 'Check server logs'}`);
                const errorLine = logContainer.lastChild;
                if (errorLine) errorLine.style.color = "#ff3333";
            }
            
        } catch (err) {
            // FIX 3: Catch local network disconnects cleanly without killing the timer
            console.error("Polling interval encountered a connection drop:", err);
        }
    }, 1000); // Check every 1000ms from the very beginning

</script>

</body>
</html>
