<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Processing Image</title>
    <style>
    body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background-color: #f4f7f6;
        display: flex;
        flex-direction: column; /* Stacks the terminal box and the list vertically */
        justify-content: center;
        align-items: center;
        min-height: 100vh;      /* Prevents content cutting off if the page gets tall */
        margin: 0;
        padding: 40px 20px;     /* Adds padding at the top and bottom of the screen */
    }

    .terminal-box {
        background: #1e1e1e;
        color: #00ff00;
        font-family: 'Courier New', Courier, monospace;
        padding: 20px;
        border-radius: 8px;
        text-align: left;
        overflow-y: auto;
        box-shadow: inset 0 0 15px #000, 0 8px 30px rgba(0,0,0,0.15);
        width: 100%;           
        max-width: 1200px;    
        height: 50vh;         
        margin: 0 auto 30px auto; /* Centers the box and adds a 30px gap UNDER it */            
    }
        .log-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .log-item {
            margin-bottom: 8px;
            line-height: 1.4;
            word-break: break-all;
        }
        .log-prefix {
            color: #666;
            margin-right: 8px;
            user-select: none;
        }
        .btn-group {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 12px;
            width: 66.67%;
            max-width: 1200px;
            margin: 0 auto;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 14px 20px;
            box-sizing: border-box;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
            text-align: center;
            transition: background-color 0.15s ease, transform 0.1s ease;
        }
        /* Primary actions (Like your main page submit action background setup) */
        .btn-primary { 
            background-color: #3498db; 
            color: white; 
        }
        .btn-primary:hover { 
            background-color: #2980b9; 
        }
        .btn-primary:active {
            transform: scale(0.98);
        }
        /* Accent Laser file action variant */
        .btn-accent {
            background-color: #e67e22;
            color: white;
        }
        .btn-accent:hover {
            background-color: #d35400;
        }
        .btn-accent:active {
            transform: scale(0.98);
        }
        /* Secondary home actions fallback */
        .btn-secondary { 
            background-color: #e2e8f0; 
            color: #4a5568; 
        }
        .btn-secondary:hover { 
            background-color: #cbd5e1; 
        }
        .btn-secondary:active {
            transform: scale(0.98);
        }        
        .btn-success {
            background-color: #218c53 !important;
            color: white !important;
        }

        .btn-success:hover {
            background-color: #1a7042 !important;
        }

        .btn-success:active {
            transform: scale(0.98);
        }
        .btn-disabled {
            background-color: #6b7280 !important;
            color: #d1d5db !important;
            cursor: not-allowed !important;
            opacity: 0.6;
            pointer-events: none;
        }        
    </style>
</head>
<body>
    
        <div class="terminal-box" id="terminal">
            <ul class="log-list" id="log-container">
                <li class="log-item"><span class="log-prefix">$</span>Connecting to script pipeline...</li>
            </ul>
        </div>
        <!-- Right Side: Live Processed Files History -->
        <aside class="downloads-sidebar">
            <ul id="download-list" class="download-list">
            <div class="btn-group">
                <a href="/download/{{ task_id }}" class="btn btn-accent">Download SVG file)</a>                
                <a href="/download-lbrn2/{{ task_id }}" class="btn btn-accent">Download LightBurn File (.lbrn2)</a>
                <a href="/" class="btn btn-secondary">Process Another Image</a>
            </div>
            </ul>
        </aside>

<script>
const taskId = "{{ task_id }}";
const logContainer = document.getElementById("log-container");
const terminalBox = document.getElementById("terminal");

let logIndex = 0;

// Disable download buttons initially
const links = document.querySelectorAll('.downloads-sidebar .btn-group a');

links.forEach(link => {
    link.classList.add('btn-disabled');
});

function appendLogMessage(message) {
    const cleanMessage = message ? message.trim() : "";

    if (!cleanMessage || cleanMessage === "Waiting to start...") {
        return;
    }

    const li = document.createElement("li");
    li.className = "log-item";
    li.innerHTML = `<span class="log-prefix">$</span>${cleanMessage}`;
    logContainer.appendChild(li);

    terminalBox.scrollTop = terminalBox.scrollHeight;
}

// Start checking logs immediately
const checkStatus = setInterval(async () => {
    try {
        const response = await fetch(`/task-status/${taskId}`);

        if (!response.ok) {
            console.warn(
                `Server booting task or unavailable. Status: ${response.status}`
            );
            return;
        }

        const data = await response.json();

        const currentLogs = data.logs || [];

        // Process and append new logs
        if (currentLogs.length > logIndex) {
            const newLines = currentLogs.slice(logIndex);

            newLines.forEach((logMessage) => {
                appendLogMessage(logMessage);
            });

            logIndex = currentLogs.length;
        }

        // Task completed successfully
        if (data.status === "completed") {
            clearInterval(checkStatus);

            appendLogMessage("Task completed successfully!");

            setTimeout(() => {
                const links = document.querySelectorAll(
                    '.downloads-sidebar .btn-group a'
                );

                links.forEach(link => {
                    link.classList.remove(
                        'btn-disabled',
                        'btn-primary',
                        'btn-accent',
                        'btn-secondary'
                    );

                    link.classList.add('btn-success');
                });
            }, 500);
        }

        // Task failed
        else if (data.status === "failed") {
            clearInterval(checkStatus);

            appendLogMessage(
                `CRITICAL FAILURE: ${data.error || 'Check server logs'}`
            );

            const errorLine = logContainer.lastChild;

            if (errorLine) {
                errorLine.style.color = "#ff3333";
            }
        }

    } catch (err) {
        console.error(
            "Polling interval encountered a connection drop:",
            err
        );
    }
}, 1000);
</script>

</body>
</html>
