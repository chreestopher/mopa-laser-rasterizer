<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Processing Image</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .terminal-box {
            background: #1e1e1e;
            color: #00ff00;
            font-family: 'Courier New', Courier, monospace;
            padding: 20px;
            border-radius: 8px;
            text-align: left;
            width: 90%;
            max-width: 600px;
            height: 300px;
            overflow-y: auto;
            box-shadow: inset 0 0 15px #000, 0 8px 30px rgba(0,0,0,0.15);
        }
        .log-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .log-item {
            margin-bottom: 8px;
            line-height: 1.4;
            word-break: break-all;
        }
        .log-prefix {
            color: #666;
            margin-right: 8px;
            user-select: none;
        }
    </style>
</head>
<body>

    <div class="terminal-box" id="terminal">
        <ul class="log-list" id="log-container">
            <li class="log-item"><span class="log-prefix">$</span>Connecting to script pipeline...</li>
        </ul>
    </div>

    <script>
        const taskId = "{{ task_id }}";
        const logContainer = document.getElementById("log-container");
        const terminalBox = document.getElementById("terminal");
        const visibleLogs = new Set(["Connecting to script pipeline..."]);

        function appendLogMessage(message) {
            const cleanMessage = message ? message.trim() : "";
            if (!cleanMessage || cleanMessage === "" || cleanMessage === "Waiting to start..." || visibleLogs.has(cleanMessage)) {
                return; 
            }
            visibleLogs.add(cleanMessage);

            const li = document.createElement("li");
            li.className = "log-item";
            li.innerHTML = `<span class="log-prefix">$</span>${cleanMessage}`;
            logContainer.appendChild(li);
            terminalBox.scrollTop = terminalBox.scrollHeight;
        }

        setTimeout(() => {
            const checkStatus = setInterval(async () => {
                try {
                    const response = await fetch(`/task-status/${taskId}`);
                    if (!response.ok) return;

                    const data = await response.json();

                    if (data.current_log) {
                        if (Array.isArray(data.current_log)) {
                            data.current_log.forEach((logMessage) => {
                                appendLogMessage(logMessage);
                            });
                        } else if (typeof data.current_log === 'string') {
                            appendLogMessage(data.current_log);
                        }
                    }

                    // FIX: Bypass browser drive-by download blocks by redirecting 
                    // immediately to the success page instead of clicking hidden tags!
                    if (data.status === "completed") {
                        clearInterval(checkStatus);
                        appendLogMessage("Task completed successfully! Redirecting to dashboard...");
                        
                        // Navigate directly to your final template screen layout
                        window.location.href = "/success/" + taskId;
                    }
                    else if (data.status === "failed") {
                        clearInterval(checkStatus);
                        appendLogMessage(`CRITICAL FAILURE: ${data.error || 'Check server logs'}`);
                        const errorLine = logContainer.lastChild;
                        if (errorLine) errorLine.style.color = "#ff3333";
                    }
                } catch (err) {
                    console.error("Polling stream exception error:", err);
                }
            }, 1000); 

        }, 1500);
    </script>

</body>
</html>
