<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Processing Image</title>
    <style>

    * {
        box-sizing: border-box;
    }   
    .page-header {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
    }

    .page-header h1 {
        margin: 0;
        font-size: 32px;
        font-weight: 700;
        color: #1e1e1e;
    }         
    body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background-color: #f4f7f6;
        display: flex;
        flex-direction: column;

        width: 100vw;
        height: 100vh;
        overflow: hidden;

        box-sizing: border-box;
        margin: 0;
        padding: 6.25vh 6.25vw;
    }
    /* Terminal scrollbar */
    .terminal-box::-webkit-scrollbar {
        width: 10px;
    }

    .terminal-box::-webkit-scrollbar-track {
        background: #151515;
        border-radius: 8px;
    }

    .terminal-box::-webkit-scrollbar-thumb {
        background: #218c53;
        border-radius: 8px;
        border: 2px solid #151515;
    }

    .terminal-box::-webkit-scrollbar-thumb:hover {
        background: #1a7042;
    }
    .terminal-box {
        flex: 7;
        min-height: 0;
        background: #1e1e1e;
        color: #00ff00;
        font-family: 'Courier New', Courier, monospace;
        padding: 20px;
        border-radius: 8px;
        text-align: left;
        overflow-y: auto;
        overflow-x: hidden;

        box-shadow: inset 0 0 15px #000, 0 8px 30px rgba(0,0,0,0.15);

        width: 100%;
        max-width: none;
        box-sizing: border-box;

        margin: 0 0 30px 0;

        scrollbar-width: thin;
        scrollbar-color: #218c53 #151515;
    }
    .log-list {
        list-style: none;
        padding: 0;
        margin: 0;
    }
    .log-item {
        margin-bottom: 8px;
        line-height: 1.4;
        word-break: break-all;
    }
    .log-prefix {
        color: #666;
        margin-right: 8px;
        user-select: none;
    }
    .files-panel {
        flex: 2;
        min-height: 150px;
        width: 100%;
        padding: 16px 20px;
        background: #1e1e1e;
        color: #d1fae5;
        border-radius: 8px;
        box-shadow: inset 0 0 15px #000, 0 8px 30px rgba(0,0,0,.15);
        font-family: 'Courier New', Courier, monospace;
        display: flex;
        flex-direction: column;
        overflow: hidden;
    }
    .files-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding-bottom: 10px;
        border-bottom: 1px solid #235438;
    }
    .files-header h2 { margin: 0; font-size: 16px; color: #00ff00; }
    .download-list {
        list-style: none;
        padding: 0;
        margin: 10px 0 0;
        overflow-y: auto;
    }
    .file-item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
        padding: 9px 0;
        border-bottom: 1px solid #303b35;
    }
    .file-name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .file-status { color: #94a3b8; font-size: 12px; }
    .file-actions { display: flex; flex: 0 0 auto; gap: 8px; }
    .download-button, .another-button {
        padding: 7px 11px;
        border-radius: 5px;
        background: #218c53;
        color: white;
        font: 700 13px system-ui, sans-serif;
        text-decoration: none;
    }
    .download-button:hover, .another-button:hover { background: #1a7042; }
    .download-button.disabled {
        background: #4b5563;
        color: #cbd5e1;
        pointer-events: none;
        opacity: .65;
    }
    .empty-files { color: #94a3b8; padding: 12px 0; }
    @media (max-width: 700px) {
        body { padding: 3vh 3vw; }
        .file-item { align-items: flex-start; flex-direction: column; }
        .file-actions { width: 100%; }
        .download-button { flex: 1; text-align: center; }
    }
    :root {
        --metal-dark: #1b1e18;
        --metal: #34382e;
        --metal-edge: #777864;
        --cream: #d8d1ad;
        --phosphor: #83f06a;
        --orange: #ad4f1d;
    }
    body {
        position: relative;
        color: var(--cream);
        background:
            repeating-linear-gradient(90deg, rgba(255,255,255,.014) 0 1px, transparent 1px 4px),
            radial-gradient(circle at 50% 15%, #4a4e3e 0, #292d25 45%, #151713 100%);
        border: 3px solid #686957;
        border-radius: 32px;
        box-shadow: inset 0 0 0 5px #171914, inset 0 0 55px #000, 0 0 0 1px #96977d;
    }
    body::before, body::after {
        content: "✦";
        position: fixed;
        top: 18px;
        color: #8e8e73;
        font-size: 18px;
        text-shadow: 0 2px 2px #000;
    }
    body::before { left: 22px; }
    body::after { right: 22px; }
    .page-header { flex-direction: column; min-height: 72px; }
    .page-header h1 {
        color: var(--cream);
        font-family: Impact, "Arial Narrow", sans-serif;
        font-weight: 500;
        letter-spacing: .12em;
        text-transform: uppercase;
        text-shadow: 0 3px #111;
    }
    .page-header::after {
        content: "VECTOR PROCESSING CONSOLE · SERIES 79";
        margin-top: 7px;
        color: #bdb58f;
        font: 700 12px "Courier New", monospace;
        letter-spacing: .16em;
    }
    .terminal-box, .files-panel {
        position: relative;
        background:
            repeating-linear-gradient(0deg, rgba(130,255,100,.025) 0 1px, transparent 1px 4px),
            radial-gradient(ellipse at center, #172516 0, #0b110b 78%);
        border: 3px solid var(--metal-edge);
        border-radius: 24px;
        color: var(--phosphor);
        box-shadow: inset 0 0 0 5px #23271f, inset 0 0 36px rgba(90,255,70,.12), inset 0 0 75px #000, 0 7px 0 #11140f, 0 12px 22px rgba(0,0,0,.5);
    }
    .terminal-box { text-shadow: 0 0 7px rgba(131,240,106,.4); }
    .files-panel { color: #d5d1b4; }
    .files-header { border-color: #536347; }
    .files-header h2 { color: var(--cream); letter-spacing: .08em; }
    .file-status { color: #e1a63b; }
    .download-button, .another-button {
        border: 2px solid #d07b48;
        background: linear-gradient(#c46730, var(--orange));
        color: #fff1cd;
        box-shadow: inset 0 1px rgba(255,255,255,.25), 0 3px 0 #55270f;
        text-transform: uppercase;
        letter-spacing: .05em;
    }
    .download-button:hover, .another-button:hover { background: linear-gradient(#dc7940, #bd5a28); }
    .log-prefix { color: #55794c; }
    </style>
</head>
<body>
    
        <div class="page-header">
            <h1>MOPA-LASER-RASTERIZER</h1>
        </div>    
        <div class="terminal-box" id="terminal">
            <ul class="log-list" id="log-container">
                <li class="log-item"><span class="log-prefix">$</span>Connecting to script pipeline...</li>
            </ul>
        </div>
        <section class="files-panel" aria-labelledby="files-heading">
            <div class="files-header">
                <h2 id="files-heading">$ processed_files --last 99</h2>
                <a href="/?history_session={{ history_session }}" class="another-button">Process Another Image</a>
            </div>
            <ul id="download-list" class="download-list">
                <li class="empty-files">Waiting for processed files...</li>
            </ul>
        </section>

<script>
const taskId = "{{ task_id }}";
const historySession = "{{ history_session }}";
const logContainer = document.getElementById("log-container");
const terminalBox = document.getElementById("terminal");

let logIndex = 0;

const downloadList = document.getElementById('download-list');

function escapeHtml(value) {
    const span = document.createElement('span');
    span.textContent = value;
    return span.innerHTML;
}

async function refreshFileHistory() {
    if (!historySession) return;
    const response = await fetch(`/file-history/${historySession}`);
    if (!response.ok) return;
    const data = await response.json();
    const files = data.files || [];
    if (!files.length) {
        downloadList.innerHTML = '<li class="empty-files">No processed files in this page session.</li>';
        return;
    }
    downloadList.innerHTML = files.map(file => {
        const ready = file.status === 'completed';
        const disabled = ready ? '' : ' disabled';
        const name = escapeHtml(file.source_name || 'processed image');
        return `<li class="file-item"><div class="file-name">${name} <span class="file-status">[${file.status}]</span></div>` +
          `<div class="file-actions"><a class="download-button${disabled}" href="${file.svg_url}">SVG</a>` +
          `<a class="download-button${disabled}" href="${file.lightburn_url}">LightBurn</a></div></li>`;
    }).join('');
}

refreshFileHistory();

function appendLogMessage(message) {
    const cleanMessage = message ? message.trim() : "";

    if (!cleanMessage || cleanMessage === "Waiting to start...") {
        return;
    }

    const li = document.createElement("li");
    li.className = "log-item";
    li.innerHTML = `<span class="log-prefix">$</span>${cleanMessage}`;
    logContainer.appendChild(li);

    terminalBox.scrollTop = terminalBox.scrollHeight;
}

// Start checking logs immediately
const checkStatus = setInterval(async () => {
    try {
        const response = await fetch(`/task-status/${taskId}`);

        if (!response.ok) {
            console.warn(
                `Server booting task or unavailable. Status: ${response.status}`
            );
            return;
        }

        const data = await response.json();

        const currentLogs = data.logs || [];

        // Process and append new logs
        if (currentLogs.length > logIndex) {
            const newLines = currentLogs.slice(logIndex);

            newLines.forEach((logMessage) => {
                appendLogMessage(logMessage);
            });

            logIndex = currentLogs.length;
        }

        // Task completed successfully
        if (data.status === "completed") {
            clearInterval(checkStatus);

            appendLogMessage("Task completed successfully!");

            setTimeout(refreshFileHistory, 500);
        }

        // Task failed
        else if (data.status === "failed") {
            clearInterval(checkStatus);

            appendLogMessage(
                `CRITICAL FAILURE: ${data.error || 'Check server logs'}`
            );

            const errorLine = logContainer.lastChild;

            if (errorLine) {
                errorLine.style.color = "#ff3333";
            }
        }

    } catch (err) {
        console.error(
            "Polling interval encountered a connection drop:",
            err
        );
    }
}, 1000);
setInterval(refreshFileHistory, 3000);
</script>

</body>
</html>
