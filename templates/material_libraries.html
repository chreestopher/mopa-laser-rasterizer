<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Material Library Vault · MOPA Laser Rasterizer</title>
  <style>
    :root { --case:#1a1d1a; --panel:#252a25; --ink:#d9d6be; --green:#8df06c; --amber:#efb94f; --red:#e76554; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; padding:clamp(18px,5vw,54px); color:var(--ink); font-family:"Courier New",monospace; background:radial-gradient(circle at 50% 0,#454a43,#111410 65%); }
    .machine { width:min(1040px,100%); margin:auto; padding:clamp(16px,3vw,36px); border:7px solid #4f564c; border-radius:24px; background:repeating-linear-gradient(90deg,rgba(255,255,255,.025) 0 1px,transparent 1px 4px),var(--case); box-shadow:inset 0 0 0 3px #0b0d0a,0 18px 55px #000; }
    .theme-toggle { width:min(1040px,100%); display:flex; justify-content:flex-end; margin:0 auto 12px; color:#bdb58f; font:700 11px "Courier New",monospace; text-transform:uppercase; } .login-link,.auth-console { display:flex; align-items:center; gap:8px; margin-right:auto; color:var(--green); font:700 10px "Courier New",monospace; letter-spacing:.09em; text-decoration:none; text-transform:uppercase; } .login-link[hidden],.auth-console[hidden] { display:none; } .auth-machine-switch { position:relative; width:30px; height:30px; border:2px solid #151713; border-radius:6px; background:radial-gradient(circle at 5px 5px,#2a2c28 0 1px,transparent 1.5px),radial-gradient(circle at 25px 5px,#2a2c28 0 1px,transparent 1.5px),radial-gradient(circle at 5px 25px,#2a2c28 0 1px,transparent 1.5px),radial-gradient(circle at 25px 25px,#2a2c28 0 1px,transparent 1.5px),linear-gradient(135deg,#4c5048,#d0cec0 48%,#5b5d54); box-shadow:inset 0 0 0 2px #929488,0 2px 3px #000; } .auth-machine-switch::before { content:""; position:absolute; left:8px; bottom:7px; width:10px; height:10px; border:2px solid #20221d; border-radius:50%; background:radial-gradient(circle at 35% 30%,#f4f0db,#7d8178 48%,#373a34); box-shadow:0 0 0 1px #cbc8b4; } .auth-machine-switch::after { content:""; position:absolute; left:11px; bottom:12px; width:7px; height:21px; border:1px solid #151713; border-radius:3px 3px 1px 1px; background:linear-gradient(90deg,#42463f,#f4f1d9 50%,#4d514a); box-shadow:0 0 0 1px #c9c6b0,1px 2px 2px rgba(0,0,0,.65); transform-origin:50% calc(100% + 5px); transform:rotate(53deg); transition:transform .2s ease,box-shadow .2s ease; } .auth-machine-switch.is-on::after { transform:rotate(0); box-shadow:0 0 0 1px #c9c6b0,0 0 9px #80e85c,1px 2px 2px rgba(0,0,0,.65); } .auth-console.authorized { color:#bff39a; } .theme-toggle label { display:flex; align-items:center; gap:7px; margin:0; color:inherit; cursor:pointer; } .theme-toggle input { position:absolute; opacity:0; } .toggle-track { width:38px; height:18px; border:2px solid #777957; border-radius:999px; background:#111510; box-shadow:inset 0 1px 4px #000; } .toggle-track::after { content:""; display:block; width:10px; height:10px; margin:2px; border-radius:50%; background:#8df06c; box-shadow:0 0 6px #8df06c; transition:transform .18s ease; } .theme-toggle input:checked + .toggle-track::after { transform:translateX(18px); background:#efb94f; box-shadow:0 0 6px #efb94f; }
    .page-header { margin:0 0 20px; text-align:center; } .page-header h1 { margin:0; color:#d8d1ad; font:500 clamp(18px,4vw,50px) Impact,"Arial Narrow",sans-serif; letter-spacing:.12em; text-shadow:0 3px #111; } .home-title { display:block; color:inherit; text-decoration:none; } .facade-title { display:block; white-space:nowrap; } .console-status-line { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); align-items:center; margin-top:8px; padding:0 22px; } .console-subtitle { grid-column:2; justify-self:center; color:#bdb58f; font:700 clamp(8px,1.7vw,12px) "Courier New",monospace; letter-spacing:clamp(.04em,.7vw,.16em); white-space:nowrap; } .status-lamps { grid-column:1; justify-self:center; display:flex; gap:12px; color:#bdb58f; font:700 9px "Courier New",monospace; letter-spacing:.11em; text-transform:uppercase; } .status-lamp { display:inline-flex; align-items:center; gap:5px; } .status-lamp::before { content:""; width:10px; height:10px; border:2px solid #1a1b16; border-radius:50%; background:var(--lamp-color); box-shadow:0 0 5px var(--lamp-color),inset 0 1px 2px rgba(255,255,255,.5); animation:lamp-flicker var(--lamp-flicker,1s) linear infinite; } .mopa-lamp { --lamp-color:#fff; } .mopa-lamp::before { background:conic-gradient(#f44,#fb4,#fff34e,#55e45a,#4cecff,#8b58e8,#f44); box-shadow:0 0 6px #fff,0 0 10px #e75dde; animation:lamp-rainbow-spin .9s linear infinite; } .laser-lamp { --lamp-color:#ef4338; } .power-lamp { --lamp-color:#f0ad32; --lamp-flicker:.97s; } .raster-lamp { --lamp-color:#42c9e8; --lamp-flicker:1.31s; } .vector-lamp { --lamp-color:#dc5dd0; --lamp-flicker:.67s; } @keyframes lamp-flicker { 0%,100% { opacity:1; filter:brightness(1); } 14% { opacity:.45; } 26% { opacity:.9; } 49% { opacity:.35; } 60% { opacity:1; } 78% { opacity:.6; } } @keyframes lamp-rainbow-spin { to { transform:rotate(360deg); } }
    a { color:var(--green); } h1 { margin:0; font-size:clamp(1.25rem,4vw,2rem); letter-spacing:.08em; } .sub { color:#bdb58f; margin:.5rem 0 2rem; }
    #manager { display:block; } .panel { min-width:0; padding:18px; border:2px solid #777864; border-radius:8px; background:#1e1e1e; box-shadow:inset 0 0 15px #000,0 8px 30px rgba(0,0,0,.28); } .vault-terminal { color:#83f06a; text-shadow:0 0 7px rgba(131,240,106,.35); }

    input[type=file]::file-selector-button, input[type=file]::-webkit-file-upload-button { margin:-7px 11px -7px -7px; padding:9px 12px; border:0; border-right:2px solid #d07b48; color:#fff1cd; background:linear-gradient(#c96b35,#9f451d); cursor:pointer; font:700 12px "Courier New",monospace; letter-spacing:.05em; text-transform:uppercase; }

    button:hover { background:linear-gradient(#dc7940,#bd5a28); } button:active { transform:translateY(3px); box-shadow:inset 0 1px rgba(255,255,255,.2),0 1px 0 #55270f; }
    button.delete { color:#fff2e9; background:linear-gradient(#be5145,#7c2923); border-color:#e27263; box-shadow:inset 0 1px rgba(255,255,255,.2),0 4px 0 #40130f; }
    button.delete:hover { background:linear-gradient(#d96658,#94342d); }

    .import-plan { margin-top:16px; display:grid; gap:12px; } .import-file { padding:13px; border:1px solid #596451; border-radius:9px; background:#171b17; }
    .import-file label { margin:0 0 6px; } .library-name-input { width:min(100%,420px); padding:8px; color:#fff1cd; border:1px solid #777957; border-radius:5px; background:#111510; font:700 12px "Courier New",monospace; }
    .materials { display:flex; flex-wrap:wrap; gap:7px; margin-top:10px; } .materials label { display:flex; align-items:center; gap:5px; margin:0; padding:5px 7px; color:#d9d6be; border:1px solid #4e5a49; border-radius:4px; background:#242a23; font-size:.78rem; }
    .materials input { accent-color:#8df06c; } .rename { display:flex; gap:7px; align-items:center; flex:1; min-width:160px; } .rename .library-name-input { width:100%; } .rename button { margin:0; padding:6px 8px; font-size:.68rem; }

    .selection-actions { display:flex; align-items:center; justify-content:space-between; gap:8px; padding:9px 0 11px; border-bottom:1px solid #235438; } .selection-actions .meta { margin:0; } .selection-actions button { margin:0; padding:6px 9px; font-size:.66rem; } .settings-workspace { min-width:0; } .settings-toolbar { display:flex; align-items:center; justify-content:space-between; gap:10px; padding-bottom:12px; border-bottom:1px solid #235438; } .settings-toolbar strong { color:var(--green); font-size:.9rem; letter-spacing:.07em; } .settings-toolbar button { margin:0; padding:6px 9px; font-size:.66rem; } .settings-accordion { margin:11px 0; border:1px solid #596451; border-radius:8px; background:#171b17; overflow:hidden; } .settings-library-head { display:grid; grid-template-areas:"count" "rename" "actions"; gap:9px; padding:13px; } .rename { grid-area:rename; display:flex; gap:7px; align-items:center; min-width:160px; } .rename .library-name-input { width:100%; } .rename button { margin:0; padding:6px 8px; font-size:.68rem; } .settings-library-head .meta { grid-area:count; justify-self:start; white-space:nowrap; } .library-actions { grid-area:actions; display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:9px; } .library-actions button { display:inline-flex; align-items:center; justify-content:center; width:100%; min-height:36px; margin:0; padding:6px 10px; font-size:.68rem; white-space:nowrap; } .settings-accordion-content { padding:0 12px 12px; border-top:1px solid #374035; } .settings-accordion-content > button { margin:10px 0; } .meta { color:#b4bda9; font-size:.82rem; } .entries { overflow:auto; max-height:min(62vh,540px); padding:0 13px 13px; } table { width:100%; border-collapse:collapse; font-size:.79rem; } th,td { padding:8px 6px; text-align:left; border-bottom:1px solid #374035; vertical-align:top; } th { color:var(--amber); } .entry-row { cursor:pointer; } .entry-row:hover { color:#f3ffe8; background:linear-gradient(90deg,#526b49,#40583b); box-shadow:inset 4px 0 #a8ff7e,inset 0 0 14px rgba(141,240,108,.2); } .entry-select { width:16px; height:16px; accent-color:var(--green); cursor:pointer; } .inline-entry-editor { padding:13px; background:#20271e; box-shadow:inset 0 0 20px rgba(0,0,0,.35); } .inline-entry-editor input,.inline-entry-editor select { width:100%; padding:5px 2px; color:#fff1cd; border:0; border-radius:0; background:transparent; box-shadow:none; font:700 12px "Courier New",monospace; } .inline-entry-editor input:focus,.inline-entry-editor select:focus { outline:0; box-shadow:inset 0 0 0 1px rgba(180,255,142,.7),0 0 6px rgba(141,240,108,.28); } .inline-entry-editor small { color:#b4bda9; line-height:1.3; } .inline-entry-editor .inline-setting-row { display:grid; grid-template-columns:minmax(125px,.8fr) minmax(150px,1fr) minmax(180px,1.4fr); align-items:center; gap:10px; padding:7px 0; border-top:1px solid #374035; } .inline-entry-editor .inline-setting-row label { margin:0; color:var(--amber); font-size:.78rem; } .inline-entry-editor .inline-setting-row small { display:block; } .inline-entry-editor button { margin:12px 8px 3px 0; } .empty { color:#b4bda9; text-align:center; padding:30px; } [hidden] { display:none !important; }
    .library-equipment { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:9px; margin:0 13px 13px; } .library-equipment label { margin:0; color:#b4bda9; font-size:.7rem; } .library-equipment label.notes { grid-column:1 / -1; } .library-equipment input { display:block; width:100%; margin-top:4px; padding:6px 7px; color:#fff1cd; border:1px solid #596451; border-radius:4px; background:#111510; font:700 11px "Courier New",monospace; }
    .settings-modal { position:fixed; z-index:20; inset:0; display:grid; place-items:center; padding:18px; background:rgba(0,0,0,.72); backdrop-filter:blur(3px); } .settings-window { display:flex; flex-direction:column; width:min(820px,100%); height:min(82vh,720px); overflow:hidden; border:3px solid #867f57; border-radius:14px; background:linear-gradient(145deg,#30372f,#151914); box-shadow:inset 0 0 0 3px #11140f,0 22px 70px #000; } .settings-titlebar { flex:0 0 auto; display:flex; align-items:center; gap:12px; padding:12px 15px; border-bottom:1px solid #6d704e; color:#fff3c8; background:linear-gradient(#4b5146,#2d342c); letter-spacing:.04em; } .settings-title { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; } .settings-close { margin:0; padding:5px 9px; border-color:#9d5650; background:linear-gradient(#9d4941,#6c2a25); box-shadow:0 3px 0 #32120f; } .settings-body { min-height:0; overflow-y:auto; padding:14px; scrollbar-color:#8d8a5d #141814; scrollbar-width:thin; } .settings-body::-webkit-scrollbar { width:11px; } .settings-body::-webkit-scrollbar-track { background:#141814; } .settings-body::-webkit-scrollbar-thumb { border:2px solid #141814; border-radius:8px; background:#8d8a5d; } .settings-body .meta { margin:0 0 12px; }
    @media (max-width:760px) { .console-status-line { grid-template-columns:1fr; gap:8px; padding:0; } .status-lamps { grid-column:1; justify-self:center; flex-wrap:wrap; justify-content:center; gap:7px 10px; } .console-subtitle { grid-column:1; justify-self:center; white-space:normal; line-height:1.35; } .inline-entry-editor > label,.inline-entry-editor .inline-setting-row { grid-template-columns:1fr; gap:5px; } }
    body.light-machine { --case:#d1d2cb; --panel:#d9dad4; --ink:#171815; --green:#286d24; --amber:#7c4815; color:#171815; background:repeating-linear-gradient(90deg,rgba(0,0,0,.025) 0 1px,transparent 1px 4px),radial-gradient(circle at 50% 5%,#f0f0e9,#c8c9c3 48%,#9fa19c 100%); } body.light-machine .machine { border-color:#7c7e7a; box-shadow:inset 0 0 0 4px #a6a8a3,inset 0 0 35px #777,0 18px 55px #333; } body.light-machine .page-header h1 { color:#151613; text-shadow:0 1px #fff,0 -1px #777; } body.light-machine .console-subtitle,body.light-machine .status-lamps { color:#343530; } body.light-machine .panel,body.light-machine .library,body.light-machine .import-file,body.light-machine .settings-accordion,body.light-machine .inline-entry-editor { color:#171815; border-color:#777974; background:#d8d9d3; box-shadow:inset 0 0 15px #999; } body.light-machine .meta,body.light-machine small,body.light-machine .sub,body.light-machine .theme-toggle { color:#343530; } body.light-machine .settings-toolbar,body.light-machine .selection-actions,body.light-machine .settings-accordion summary,body.light-machine .settings-accordion-content,body.light-machine .inline-setting-row { border-color:#777974; } body.light-machine .settings-toolbar strong,body.light-machine .settings-accordion summary { color:#171815; text-shadow:0 1px #fff; } body.light-machine .entry-row:hover { background:#c0c2bb; box-shadow:inset 3px 0 #286d24; } body.light-machine th,body.light-machine td { border-color:#9a9c96; } body.light-machine input[type=file],body.light-machine .library-name-input,body.light-machine .setting-field input,body.light-machine .setting-field select,body.light-machine .inline-entry-editor input,body.light-machine .inline-entry-editor select { color:#171815; border-color:#777974; background:#dedfd9; box-shadow:inset 0 1px 5px #999; } body.light-machine .setting-field,body.light-machine .materials label { color:#171815; border-color:#777974; background:#d5d6cf; } body.light-machine .settings-window { color:#171815; border-color:#777974; background:#d8d9d3; } body.light-machine .settings-titlebar { color:#171815; border-color:#777974; background:linear-gradient(#dedfd9,#aeb0aa); } body.light-machine .settings-body::-webkit-scrollbar-track { background:#c1c2bc; } body.light-machine .settings-body::-webkit-scrollbar-thumb { border-color:#c1c2bc; background:#777974; }
    body.light-machine .inline-entry-editor input,body.light-machine .inline-entry-editor select { color:#171815; border:0; border-radius:0; background:transparent; box-shadow:none; } body.light-machine .inline-entry-editor input:focus,body.light-machine .inline-entry-editor select:focus { box-shadow:inset 0 0 0 1px rgba(40,109,36,.6),0 0 5px rgba(40,109,36,.22); } body.light-machine .library-equipment input { color:#171815; border-color:#777974; background:#dedfd9; box-shadow:inset 0 1px 5px #999; } body.light-machine .entry-row:hover { color:#171815; background:linear-gradient(90deg,#b8d2aa,#d5e5cd); box-shadow:inset 4px 0 #286d24,inset 0 0 10px rgba(40,109,36,.13); }
  </style>

<body>
  <div class="theme-toggle"><a id="login_link" class="login-link" href="/login"><span class="auth-machine-switch" aria-hidden="true"></span><span>Operator access, sign in</span></a><div id="auth_console" class="auth-console authorized" hidden><a class="auth-machine-switch is-on" href="/logout" aria-label="Sign out"></a><span>Operator authorized</span></div><label><span>Dark</span><input id="theme_switch" type="checkbox"><span class="toggle-track"></span><span>Light</span></label></div>
  <main class="machine">
    <header class="page-header">
      <h1><a class="home-title" href="/" aria-label="Return to MOPA Laser Rasterizer home"><span class="facade-title">MOPA-LASER-RASTERIZER</span></a></h1>
      <div class="console-status-line"><div class="status-lamps" role="status" aria-label="MOPA laser parameter system indicators"><span class="status-lamp mopa-lamp">MOPA</span><span class="status-lamp laser-lamp">Laser</span><span class="status-lamp power-lamp">Power</span></div><span class="console-subtitle">LASER PARAMETERIZATION CONSOLE &middot; SERIES 79</span></div>
    </header>
    <section id="sign_in_panel" class="panel" hidden><p>Sign in to open your personal Material Library Vault.</p><a href="/login">Initialize secure operator access →</a></section>
    <div id="manager" hidden>
      <section class="panel vault-terminal">
        <div id="settings_workspace" class="settings-workspace"><div class="settings-toolbar"><strong id="settings_modal_title">MATERIAL SETTINGS CONSOLE</strong></div><details id="vault_controls" class="settings-accordion"><summary>LOAD OR BUILD A SETTINGS LIBRARY</summary><div class="settings-accordion-content"><label for="libraries">Load one or more LightBurn Material Library files</label><input id="libraries" type="file" accept=".clb,.lbmat,.lbrn" multiple><button id="scan" type="button">Scan selected libraries</button><button id="new_library" type="button">New Settings Library</button><div id="import_plan" class="import-plan" hidden></div><button id="import" type="button" hidden>Import selected materials</button></div></details><div class="selection-actions"><span id="selected_count" class="meta">Selected settings: 0</span><span><button id="consolidate_settings" type="button">Consolidate View</button><button id="selected_actions" type="button" disabled>Selected actions</button></span></div><div id="settings_modal_body" class="settings-body"></div></div>
        <div id="notice" class="notice" role="status"></div>
      </section>
    </div>
  </main>
  <script>
    const themeSwitch = document.getElementById('theme_switch');
    themeSwitch.checked = (localStorage.getItem('mopa-machine-theme') || 'dark') === 'light';
    document.body.classList.toggle('light-machine', themeSwitch.checked);
    themeSwitch.addEventListener('change', () => { document.body.classList.toggle('light-machine', themeSwitch.checked); localStorage.setItem('mopa-machine-theme', themeSwitch.checked ? 'light' : 'dark'); });
    const notice = document.getElementById('notice');
    const say = (message, error=false) => { notice.textContent = message; notice.classList.toggle('error', error); };
    const esc = value => String(value ?? '').replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
    const selectedSettings = new Map();
    let savedLibraries = [];
    const activeInlineEntryKeys = new Set();
    let activeNewLibraryId = '';
    const updateSelectedCount = () => {
      const count = selectedSettings.size;
      document.getElementById('selected_count').textContent = `Selected settings: ${count}`;
      document.getElementById('selected_actions').disabled = !count;
    };
    const selectionKey = (libraryId, entry) => `${libraryId}:${entry.entry_id}`;
    const renderEntries = (summary, libraryId, clickable=false, selectable=false) => {
      const entries = summary?.entries || [];
      if (!entries.length) return '<p class="meta">Open settings to inspect this library.</p>';
      return `<div class="entries"><table><thead><tr>${selectable ? '<th>Pick</th>' : ''}<th>Material</th><th>Type</th><th>Description</th></tr></thead><tbody>${entries.map((entry, index) => { const key = selectionKey(libraryId, entry); return `<tr${clickable ? ` class="entry-row" data-library-id="${esc(libraryId)}" data-entry-index="${index}"` : ''}>${selectable ? `<td><input class="entry-select" type="checkbox" data-library-id="${esc(libraryId)}" data-entry-index="${index}" ${selectedSettings.has(key) ? 'checked' : ''} aria-label="Select ${esc(entry.description)}"></td>` : ''}<td>${esc(entry.material)}</td><td>${esc(entry.type)}</td><td>${esc(entry.description)}</td></tr>${activeInlineEntryKeys.has(key) ? `<tr><td colspan="${selectable ? 4 : 3}">${inlineEntryEditor(libraryId, entry)}</td></tr>` : ''}`; }).join('')}</tbody></table></div>`;
    };
    const load = async () => {
      const response = await fetch('/account/material-libraries', {credentials:'same-origin'});
      const data = await response.json();
      if (!response.ok) throw new Error(data.message || 'Could not load libraries.');
      savedLibraries = data.libraries || [];
    };
    const settingsWorkspace = document.getElementById('settings_workspace');
    const settingsTitle = document.getElementById('settings_modal_title');
    const settingsBody = document.getElementById('settings_modal_body');
    let detailedLibraries = new Map();
    let activeEntries = [];
    let activeLibraryName = '';
    let activeLibraryId = '';
    const selectionBody = settingsBody;
    const selectionControls = () => {
      const action = document.getElementById('selection_action')?.value || 'export';
      const target = action === 'copy_existing' ? `<label>Destination Rasterizer library<select id="selection_target_library" class="library-name-input">${savedLibraries.map(library => `<option value="${esc(library.library_id)}">${esc(library.name)}</option>`).join('')}</select></label>` : '';
      const newName = action === 'copy_new' ? '<label>New Rasterizer library name<input id="selection_new_library_name" class="library-name-input" placeholder="My Color Settings"></label>' : '';
      return `<p class="meta">${selectedSettings.size} selected setting${selectedSettings.size === 1 ? '' : 's'} will be written under one exact Material Name.</p><label>Action<select id="selection_action" class="library-name-input"><option value="export"${action === 'export' ? ' selected' : ''}>Export to LightBurn</option><option value="copy_existing"${action === 'copy_existing' ? ' selected' : ''}>Copy to a saved library</option><option value="copy_new"${action === 'copy_new' ? ' selected' : ''}>Copy to a new saved library</option></select></label><label>Material Name<input id="selection_material_name" class="library-name-input" value="colors - stainless steel" placeholder="colors - stainless steel"></label><small>This exact name becomes the Material Name inside the exported or copied LightBurn settings.</small>${target}${newName}<button id="selection_submit" type="button">${action === 'export' ? 'Download LightBurn Library' : 'Copy selected settings'}</button>`;
    };
    const openSelectionActions = () => { settingsTitle.textContent = 'SELECTED MATERIAL SETTINGS'; selectionBody.innerHTML = selectionControls(); };
    const selectedActionsButton = document.getElementById('selected_actions');
    if (selectedActionsButton) selectedActionsButton.addEventListener('click', openSelectionActions);
    document.getElementById('consolidate_settings').addEventListener('click', () => {
      activeInlineEntryKeys.clear(); activeNewLibraryId = '';
      settingsBody.querySelectorAll('.inline-entry-editor').forEach(editor => (editor.closest('tr') || editor).remove());
    });
    const showSettingsWorkspace = async (expandLibraryId='') => {
      settingsTitle.textContent = 'MATERIAL SETTINGS CONSOLE';
      settingsBody.innerHTML = '<p class="meta">Loading the selected settings banks…</p>';
      try {
        const loaded = await Promise.all(savedLibraries.map(async library => {
          const response = await fetch(`/account/material-libraries/${encodeURIComponent(library.library_id)}`, {credentials:'same-origin'});
          const data = await response.json();
          if (!response.ok) throw new Error(data.message || `Could not read ${library.name}.`);
          return data.library;
        }));
        detailedLibraries = new Map(loaded.map(library => [library.library_id, library]));
        settingsBody.innerHTML = loaded.length ? `<p class="meta">Open any settings bank, check entries for the shared export tray, or click an entry to edit it in place.</p>${loaded.map(library => `<section class="settings-accordion" data-library-id="${esc(library.library_id)}"><div class="settings-library-head"><span class="meta">Settings: ${esc(library.summary?.entry_count ?? 0)}</span><div class="rename"><input class="library-name-input" value="${esc(library.name)}" aria-label="Library name"><button class="rename-button" type="button">Save Library Details</button></div><div class="library-actions"><button class="settings-toggle" type="button" aria-expanded="${library.library_id === expandLibraryId}">${library.library_id === expandLibraryId ? 'Close Settings Bank' : 'Open Settings Bank'}</button><button class="delete" type="button">Delete</button></div></div><div class="library-equipment"><label>Laser Source<input class="library-laser-source" value="${esc(library.laser_source)}" placeholder="Optional"></label><label>Lens Field of View<input class="library-lens-field-of-view" value="${esc(library.lens_field_of_view)}" placeholder="Optional, e.g. 110 × 110 mm"></label><label class="notes">Notes<input class="library-notes" value="${esc(library.notes)}" placeholder="Optional setup notes"></label></div><div class="settings-accordion-content" ${library.library_id === expandLibraryId ? '' : 'hidden'}><button class="settings-add-library" data-library-id="${esc(library.library_id)}" type="button">Add Setting</button>${activeNewLibraryId === library.library_id ? inlineEntryEditor(library.library_id) : ''}${renderEntries(library.summary, library.library_id, true, true)}</div></section>`).join('')}` : '<p class="empty">No saved libraries yet. Use the library intake section above to import one or build a new library.</p>';
      } catch (error) { settingsBody.innerHTML = `<p class="notice error">${esc(error.message)}</p>`; }
    };
    const showEntryList = () => showSettingsWorkspace(activeLibraryId);
    const showEntrySettings = entry => {
      settingsTitle.textContent = `${entry.material || 'Material'} · ${entry.type || 'Setting'} · ${entry.description || 'Untitled'}`;
      settingsBody.dataset.entryId = entry.entry_id;
      const values = entry.settings || {};
      settingsBody.innerHTML = `<button id="settings_back" type="button">Back to entries</button><button id="settings_edit" type="button">Edit Setting</button><div class="entries"><table><thead><tr><th>Setting</th><th>Value</th></tr></thead><tbody>${Object.entries(values).map(([key, value]) => `<tr><td>${esc(key)}</td><td>${esc(typeof value === 'object' ? JSON.stringify(value) : value)}</td></tr>`).join('')}</tbody></table></div>`;
    };
    const mopaFields = [
      ['speed', 'Speed (mm/s)', 'How fast the galvo moves while marking.', 'number'],
      ['maxPower', 'Maximum Power (%)', 'Highest laser power used for this color.', 'number'],
      ['minPower', 'Minimum Power (%)', 'Power used when the scan slows down at corners.', 'number'],
      ['frequency', 'Frequency (Hz)', 'Pulse repetition rate. This is one of the main color controls, for example 300000 means 300 kHz.', 'number'],
      ['QPulseWidth', 'Pulse Width (ns)', 'How long each laser pulse lasts. Smaller or larger values can dramatically change color.', 'number'],
      ['interval', 'Line Interval (mm)', 'Distance between neighboring fill lines. Smaller numbers pack lines closer together.', 'number'],
      ['angle', 'Fill Angle (degrees)', 'Direction of the hatch lines.', 'number'],
      ['dotTime', 'Dot Time', 'Extra dwell at each point, useful for dot-style marking.', 'number'],
      ['dotSpacing', 'Dot Spacing (mm)', 'Distance between dots when dot marking is used.', 'number'],
      ['numPasses', 'Passes', 'How many times this layer runs.', 'number'],
      ['anglePerPass', 'Angle Per Pass', 'Rotates the hatch direction between passes.', 'number'],
      ['crossHatch', 'Cross Hatch', 'Adds a second hatch direction for denser coverage.', 'checkbox'],
      ['bidir', 'Bidirectional Fill', 'Marks in both travel directions instead of returning between lines.', 'checkbox'],
      ['overscan', 'Overscan', 'Extra travel beyond the artwork before changing direction.', 'number'],
      ['overscanPercent', 'Overscan (%)', 'Overscan expressed as a percentage.', 'number'],
    ];
    const inlineEntryEditor = (libraryId, entry=null) => {
      const data = entry || {material:'colors - stainless steel', description:'', type:'Scan', settings:{minPower:15,maxPower:15,speed:1000,frequency:300000,QPulseWidth:50,interval:.002}};
      const controls = mopaFields.map(([key, label, help, kind]) => `<div class="inline-setting-row"><label for="inline_${libraryId}_${entry?.entry_id ?? 'new'}_${key}">${label}</label>${kind === 'checkbox' ? `<input id="inline_${libraryId}_${entry?.entry_id ?? 'new'}_${key}" data-setting-key="${key}" type="checkbox" ${data.settings?.[key] ? 'checked' : ''}>` : `<input id="inline_${libraryId}_${entry?.entry_id ?? 'new'}_${key}" data-setting-key="${key}" type="number" step="any" value="${esc(data.settings?.[key] ?? '')}">`}<small>${help}</small></div>`).join('');
      return `<div class="inline-entry-editor" data-library-id="${esc(libraryId)}" data-entry-id="${entry ? esc(entry.entry_id) : ''}"><div class="inline-setting-row"><label>Material Name</label><input data-entry-field="material" value="${esc(data.material)}"><small>Matches the Material Name used in Rasterizer.</small></div><div class="inline-setting-row"><label>Description</label><input data-entry-field="description" value="${esc(data.description)}"><small>Matches the LightBurn setting Description that a palette color maps to.</small></div><div class="inline-setting-row"><label>Operation Type</label><select data-entry-field="type"><option${data.type === 'Scan' ? ' selected' : ''}>Scan</option><option${data.type === 'Offset' ? ' selected' : ''}>Offset</option><option${data.type === 'Cut' ? ' selected' : ''}>Cut</option><option${data.type === 'Image' ? ' selected' : ''}>Image</option></select><small>LightBurn operation type for this setting.</small></div>${controls}<button class="inline-save" type="button">Save Setting</button><button class="inline-cancel" type="button">Cancel</button></div>`;
    };
    let activeEditSettings = {};
    const showEntryEditor = entry => {
      const isNew = !entry;
      const data = entry || {material:'colors - stainless steel', description:'', type:'Scan', settings:{minPower:15,maxPower:15,speed:1000,frequency:300000,QPulseWidth:50,interval:.002}};
      activeEditSettings = {...(data.settings || {})};
      settingsTitle.textContent = isNew ? 'NEW MOPA COLOR SETTING' : 'EDIT MOPA COLOR SETTING';
      settingsBody.dataset.entryId = isNew ? '' : data.entry_id;
      const controls = mopaFields.map(([key, label, help, kind]) => kind === 'checkbox'
        ? `<div class="setting-field checkbox" title="${esc(help)}"><input id="setting_${key}" type="checkbox" ${activeEditSettings[key] ? 'checked' : ''}><label for="setting_${key}">${label}<small>${help}</small></label></div>`
        : `<div class="setting-field" title="${esc(help)}"><label for="setting_${key}">${label}</label><input id="setting_${key}" type="number" step="any" value="${esc(activeEditSettings[key] ?? '')}"><small>${help}</small></div>`).join('');
      settingsBody.innerHTML = `<p class="meta">The fields below are the MOPA color controls used throughout your <strong>colors - stainless steel</strong> library. Less-common imported settings are preserved automatically.</p><label>Material Name<input id="entry_material" class="library-name-input" value="${esc(data.material)}"></label><small>Usually <strong>colors - stainless steel</strong>. This must match the Material Name chosen in Rasterizer.</small><label>Description<input id="entry_description" class="library-name-input" value="${esc(data.description)}"></label><small>This is the color setting name that Rasterizer maps to a palette swatch.</small><label>Operation Type<select id="entry_type" class="library-name-input"><option${data.type === 'Scan' ? ' selected' : ''}>Scan</option><option${data.type === 'Offset' ? ' selected' : ''}>Offset</option><option${data.type === 'Cut' ? ' selected' : ''}>Cut</option><option${data.type === 'Image' ? ' selected' : ''}>Image</option></select></label><div class="setting-grid">${controls}</div><button id="settings_save" type="button">Save MOPA Setting</button><button id="settings_cancel" type="button">Cancel</button>`;
    };
    const refreshOpenLibrary = async () => {
      const response = await fetch(`/account/material-libraries/${encodeURIComponent(activeLibraryId)}`, {credentials:'same-origin'});
      const data = await response.json();
      if (!response.ok) throw new Error(data.message || 'Could not refresh library.');
      activeEntries = data.library.summary.entries || []; showEntryList(); load();
    };
    settingsBody.addEventListener('click', async event => {
      if (event.target.matches('.entry-select')) return;
      const libraryCard = event.target.closest('.settings-accordion');
      if (event.target.matches('.rename-button') && libraryCard) {
        const name = libraryCard.querySelector('.library-name-input').value.trim();
        const laser_source = libraryCard.querySelector('.library-laser-source').value.trim();
        const lens_field_of_view = libraryCard.querySelector('.library-lens-field-of-view').value.trim();
        const notes = libraryCard.querySelector('.library-notes').value.trim();
        const response = await fetch(`/account/material-libraries/${encodeURIComponent(libraryCard.dataset.libraryId)}`, {method:'PATCH', credentials:'same-origin', headers:{'Content-Type':'application/json'}, body:JSON.stringify({name, laser_source, lens_field_of_view, notes})});
        const data = await response.json();
        if (!response.ok) return say(data.message || 'Could not rename library.', true);
        say('Library details saved.'); await load(); await showSettingsWorkspace(libraryCard.dataset.libraryId); return;
      }
      if (event.target.matches('.delete') && libraryCard) {
        const libraryName = libraryCard.querySelector('.library-name-input').value.trim() || 'this library';
        if (!confirm(`Delete ${libraryName}? This removes the saved file from your account.`)) return;
        const response = await fetch(`/account/material-libraries/${encodeURIComponent(libraryCard.dataset.libraryId)}`, {method:'DELETE', credentials:'same-origin'});
        const data = await response.json();
        if (!response.ok) return say(data.message || 'Could not delete library.', true);
        say('Library removed.'); await load(); await showSettingsWorkspace(); return;
      }
      if (event.target.matches('.settings-toggle') && libraryCard) {
        const content = libraryCard.querySelector('.settings-accordion-content');
        const opening = content.hidden;
        content.hidden = !opening;
        event.target.setAttribute('aria-expanded', String(opening));
        event.target.textContent = opening ? 'Close Settings Bank' : 'Open Settings Bank';
        return;
      }
      if (event.target.matches('.inline-cancel')) {
        const editor = event.target.closest('.inline-entry-editor');
        if (editor.dataset.entryId) activeInlineEntryKeys.delete(`${editor.dataset.libraryId}:${editor.dataset.entryId}`);
        else activeNewLibraryId = '';
        (editor.closest('tr') || editor).remove(); return;
      }
      if (event.target.matches('.inline-save')) {
        const editor = event.target.closest('.inline-entry-editor');
        const libraryId = editor.dataset.libraryId;
        const entryId = editor.dataset.entryId;
        const settings = {};
        mopaFields.forEach(([key, , , kind]) => {
          const input = editor.querySelector(`[data-setting-key="${key}"]`);
          if (kind === 'checkbox') settings[key] = input.checked;
          else if (input.value !== '') settings[key] = Number(input.value);
        });
        const payload = {material:editor.querySelector('[data-entry-field="material"]').value.trim(), description:editor.querySelector('[data-entry-field="description"]').value.trim(), type:editor.querySelector('[data-entry-field="type"]').value, settings};
        const url = entryId === '' ? `/account/material-libraries/${encodeURIComponent(libraryId)}/entries` : `/account/material-libraries/${encodeURIComponent(libraryId)}/entries/${encodeURIComponent(entryId)}`;
        const response = await fetch(url, {method:entryId === '' ? 'POST' : 'PATCH', credentials:'same-origin', headers:{'Content-Type':'application/json'}, body:JSON.stringify(payload)});
        const data = await response.json();
        if (!response.ok) return say(data.message || 'Could not save setting.', true);
        if (entryId) activeInlineEntryKeys.delete(`${libraryId}:${entryId}`);
        activeNewLibraryId = ''; say('Material Library setting saved.'); await load(); await showSettingsWorkspace(libraryId); return;
      }
      const row = event.target.closest('.entry-row');
      if (row) {
        const library = detailedLibraries.get(row.dataset.libraryId);
        const entry = library?.summary?.entries?.[Number(row.dataset.entryIndex)];
        if (!entry) return;
        activeLibraryId = row.dataset.libraryId;
        activeLibraryName = library.name;
        activeEntries = library.summary.entries;
        const key = selectionKey(activeLibraryId, entry);
        const existingEditor = row.nextElementSibling?.querySelector('.inline-entry-editor');
        if (activeInlineEntryKeys.has(key) && existingEditor) { activeInlineEntryKeys.delete(key); row.nextElementSibling.remove(); return; }
        activeInlineEntryKeys.add(key);
        const editorRow = document.createElement('tr');
        editorRow.innerHTML = `<td colspan="4">${inlineEntryEditor(activeLibraryId, entry)}</td>`;
        row.insertAdjacentElement('afterend', editorRow);
        return;
      }
      if (event.target.matches('#settings_back')) showEntryList();
      if (event.target.matches('.settings-add-library')) {
        const library = detailedLibraries.get(event.target.dataset.libraryId);
        activeLibraryId = event.target.dataset.libraryId;
        activeLibraryName = library?.name || 'MATERIAL LIBRARY SETTINGS';
        activeEntries = library?.summary?.entries || [];
        activeNewLibraryId = activeLibraryId;
        event.target.insertAdjacentHTML('afterend', inlineEntryEditor(activeLibraryId));
        return;
      }
      if (event.target.matches('#settings_edit')) { const rowId = settingsBody.dataset.entryId; showEntryEditor(activeEntries.find(entry => String(entry.entry_id) === String(rowId))); }
      if (event.target.matches('#settings_cancel')) showEntryList();
      if (event.target.matches('#settings_save')) {
        const settings = {...activeEditSettings};
        mopaFields.forEach(([key, , , kind]) => {
          const input = document.getElementById(`setting_${key}`);
          if (kind === 'checkbox') settings[key] = input.checked;
          else if (input.value !== '') settings[key] = Number(input.value);
        });
        const payload = {material:document.getElementById('entry_material').value.trim(), description:document.getElementById('entry_description').value.trim(), type:document.getElementById('entry_type').value, settings};
        const entryId = settingsBody.dataset.entryId;
        const url = entryId === '' ? `/account/material-libraries/${encodeURIComponent(activeLibraryId)}/entries` : `/account/material-libraries/${encodeURIComponent(activeLibraryId)}/entries/${encodeURIComponent(entryId)}`;
        const response = await fetch(url, {method:entryId === '' ? 'POST' : 'PATCH', credentials:'same-origin', headers:{'Content-Type':'application/json'}, body:JSON.stringify(payload)});
        const data = await response.json();
        if (!response.ok) return say(data.message || 'Could not save setting.', true);
        try { await refreshOpenLibrary(); say('Material Library setting saved.'); } catch (error) { say(error.message, true); }
      }
    });
    settingsBody.addEventListener('change', event => {
      if (!event.target.matches('.entry-select')) return;
      const library = detailedLibraries.get(event.target.dataset.libraryId);
      const entry = library?.summary?.entries?.[Number(event.target.dataset.entryIndex)];
      if (!entry) return;
      const key = selectionKey(event.target.dataset.libraryId, entry);
      if (event.target.checked) selectedSettings.set(key, {library_id:event.target.dataset.libraryId, entry_id:entry.entry_id});
      else selectedSettings.delete(key);
      updateSelectedCount();
    });
    selectionBody.addEventListener('change', event => {
      if (event.target.matches('#selection_action')) selectionBody.innerHTML = selectionControls();
    });
    selectionBody.addEventListener('click', async event => {
      if (!event.target.matches('#selection_submit')) return;
      const action = document.getElementById('selection_action').value;
      const payload = {action, selections:[...selectedSettings.values()], material_name:document.getElementById('selection_material_name').value.trim()};
      if (action === 'copy_existing') payload.target_library_id = document.getElementById('selection_target_library').value;
      if (action === 'copy_new') payload.new_library_name = document.getElementById('selection_new_library_name').value.trim();
      const response = await fetch('/account/material-libraries/selected-settings', {method:'POST', credentials:'same-origin', headers:{'Content-Type':'application/json'}, body:JSON.stringify(payload)});
      if (action === 'export' && response.ok) {
        const blob = await response.blob();
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = `${payload.material_name || 'rasterizer-material-settings'}.clb`;
        link.click(); URL.revokeObjectURL(link.href);
        say('LightBurn Material Library downloaded.');
      } else {
        const data = await response.json().catch(() => ({}));
        if (!response.ok) return say(data.message || 'Could not process the selected settings.', true);
        say(action === 'copy_new' ? 'New Rasterizer Material Library created.' : 'Selected settings copied into the saved library.');
      }
      selectedSettings.clear(); updateSelectedCount(); await load(); await showSettingsWorkspace();
    });
    const fileInput = document.getElementById('libraries');
    const importPlan = document.getElementById('import_plan');
    const importButton = document.getElementById('import');
    document.getElementById('scan').addEventListener('click', async () => {
      const files = fileInput.files;
      if (!files.length) return say('Choose at least one Material Library file first.', true);
      const body = new FormData(); Array.from(files).forEach(file => body.append('libraries', file));
      say('Scanning Material Library settings…');
      const response = await fetch('/account/material-libraries/preview', {method:'POST', credentials:'same-origin', body});
      const data = await response.json();
      if (!response.ok) return say(data.message || 'Could not scan libraries.', true);
      importPlan.innerHTML = data.libraries.map(library => `<div class="import-file" data-index="${library.index}"><label>Library name</label><input class="library-name-input import-name" value="${esc(library.filename.replace(/\.[^.]+$/, ''))}"><div class="meta">Choose the material groups to import from ${esc(library.filename)}:</div><div class="materials">${library.summary.material_names.map(material => `<label><input type="checkbox" value="${esc(material)}" checked> ${esc(material)}</label>`).join('')}</div></div>`).join('');
      importPlan.hidden = false; importButton.hidden = false; say('Choose the materials to keep, then import.');
    });
    importButton.addEventListener('click', async () => {
      const body = new FormData(); Array.from(fileInput.files).forEach(file => body.append('libraries', file));
      const names = {}, selected = {};
      importPlan.querySelectorAll('.import-file').forEach(card => { const index = card.dataset.index; names[index] = card.querySelector('.import-name').value.trim(); selected[index] = Array.from(card.querySelectorAll('input[type=checkbox]:checked')).map(input => input.value); });
      body.append('library_names', JSON.stringify(names)); body.append('selected_materials', JSON.stringify(selected));
      say('Importing selected materials…');
      const response = await fetch('/account/material-libraries', {method:'POST', credentials:'same-origin', body}); const data = await response.json();
      if (!response.ok) return say(data.message || 'Could not import libraries.', true);
      fileInput.value = ''; importPlan.hidden = true; importPlan.innerHTML = ''; importButton.hidden = true; say(`${data.libraries.length} Material Library file(s) imported.`); load();
    });
    document.getElementById('new_library').addEventListener('click', async () => {
      const name = prompt('Name this new Material Library:');
      if (!name || !name.trim()) return;
      try {
        const response = await fetch('/account/material-libraries/new', {method:'POST', credentials:'same-origin', headers:{'Content-Type':'application/json'}, body:JSON.stringify({name:name.trim()})});
        const data = await response.json();
        if (!response.ok) return say(data.message || 'Could not create library.', true);
        say('New Settings Library created. Open Settings, then Add Setting.'); load();
      } catch (_) { say('Could not create the library. Check the server logs for details.', true); }
    });
    fetch('/auth-status', {credentials:'same-origin'}).then(response => response.json()).then(data => { document.getElementById('login_link').hidden = Boolean(data.signed_in); document.getElementById('auth_console').hidden = !data.signed_in; document.getElementById(data.signed_in ? 'manager' : 'sign_in_panel').hidden = false; if (data.signed_in) load().then(() => showSettingsWorkspace()).catch(error => say(error.message, true)); }).catch(() => { document.getElementById('sign_in_panel').hidden = false; });
  </script>
</body>
</html>
