AWSTemplateFormatVersion: "2010-09-09"
Description: Isolated AWS-native staging data plane for MOPA Rasterizer.

Parameters:
  EnvironmentName:
    Type: String
    Default: serverless-staging
  ArtifactRetentionDays:
    Type: Number
    Default: 7

Resources:
  ArtifactBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: {SSEAlgorithm: AES256}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      CorsConfiguration:
        CorsRules:
          # This does not grant S3 access. It only lets browsers use a valid,
          # short-lived presigned POST whose policy still enforces key, token,
          # content type, and byte limits.
          - AllowedHeaders: ["*"]
            AllowedMethods: [POST]
            AllowedOrigins: ["*"]
            ExposedHeaders: [ETag]
            MaxAge: 600
      LifecycleConfiguration:
        Rules:
          - Id: ExpireStagingJobs
            Status: Enabled
            Prefix: jobs/
            ExpirationInDays: !Ref ArtifactRetentionDays
          - Id: ExpireTransientGuestJobArtifacts
            Status: Enabled
            TagFilters:
              - {Key: mopa-retention, Value: guest}
            ExpirationInDays: 1
          - Id: ExpireStagingAccountJobArtifacts
            Status: Enabled
            TagFilters:
              - {Key: mopa-retention, Value: job}
            ExpirationInDays: !Ref ArtifactRetentionDays
          - Id: ExpireUnfinalizedVaultImports
            Status: Enabled
            Prefix: imports/
            ExpirationInDays: 1
          - Id: AbortIncompleteStagingUploads
            Status: Enabled
            Prefix: ""
            AbortIncompleteMultipartUpload: {DaysAfterInitiation: 1}

  RuntimeTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - {AttributeName: pk, AttributeType: S}
        - {AttributeName: sk, AttributeType: S}
      KeySchema:
        - {AttributeName: pk, KeyType: HASH}
        - {AttributeName: sk, KeyType: RANGE}
      PointInTimeRecoverySpecification: {PointInTimeRecoveryEnabled: true}
      SSESpecification: {SSEEnabled: true}
      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true

  DeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      SqsManagedSseEnabled: true
      MessageRetentionPeriod: 1209600

  JobQueue:
    Type: AWS::SQS::Queue
    Properties:
      SqsManagedSseEnabled: true
      ReceiveMessageWaitTimeSeconds: 20
      VisibilityTimeout: 7200
      MessageRetentionPeriod: 604800
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt DeadLetterQueue.Arn
        maxReceiveCount: 3

  DlqPolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues: [!Ref DeadLetterQueue]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {Service: sqs.amazonaws.com}
            Action: sqs:SendMessage
            Resource: !GetAtt DeadLetterQueue.Arn
            Condition:
              ArnEquals: {aws:SourceArn: !GetAtt JobQueue.Arn}

Outputs:
  ArtifactBucketName: {Value: !Ref ArtifactBucket}
  RuntimeTableName: {Value: !Ref RuntimeTable}
  JobQueueUrl: {Value: !Ref JobQueue}
  JobQueueArn: {Value: !GetAtt JobQueue.Arn}
  DeadLetterQueueUrl: {Value: !Ref DeadLetterQueue}
  DeadLetterQueueArn: {Value: !GetAtt DeadLetterQueue.Arn}
