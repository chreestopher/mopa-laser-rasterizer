<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc"><title id="title">Holographic etching calibration loop</title><desc id="desc">Generate a grid, engrave it, photograph the result, analyze measured colors, save recipes, and map artwork to diffraction layers.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3 0 6Z" fill="#8ee474"/></marker></defs><rect width="1000" height="600" rx="24" fill="#0e110e"/><circle cx="500" cy="300" r="95" fill="#202820" stroke="#8ee474" stroke-width="4"/><text x="500" y="285" fill="#e4e3cf" font-family="system-ui" font-size="28" font-weight="700" text-anchor="middle">Measured</text><text x="500" y="322" fill="#e4e3cf" font-family="system-ui" font-size="28" font-weight="700" text-anchor="middle">workflow</text>
  <g fill="#1b211b" stroke="#61705e" stroke-width="3"><rect x="390" y="35" width="220" height="95" rx="14"/><rect x="700" y="155" width="220" height="95" rx="14"/><rect x="700" y="350" width="220" height="95" rx="14"/><rect x="390" y="470" width="220" height="95" rx="14"/><rect x="80" y="350" width="220" height="95" rx="14"/><rect x="80" y="155" width="220" height="95" rx="14"/></g><g fill="#e4e3cf" font-family="system-ui" font-size="21" font-weight="700" text-anchor="middle"><text x="500" y="75">1. Generate grid</text><text x="500" y="105" font-size="16" font-weight="400">intervals · angles · settings</text><text x="810" y="195">2. Engrave test</text><text x="810" y="225" font-size="16" font-weight="400">on the intended material</text><text x="810" y="390">3. Photograph</text><text x="810" y="420" font-size="16" font-weight="400">controlled light + view</text><text x="500" y="510">4. Analyze cells</text><text x="500" y="540" font-size="16" font-weight="400">observed color + confidence</text><text x="190" y="390">5. Save recipes</text><text x="190" y="420" font-size="16" font-weight="400">keep trusted measurements</text><text x="190" y="195">6. Build artwork</text><text x="190" y="225" font-size="16" font-weight="400">map pixels to recipes</text></g><g fill="none" stroke="#8ee474" stroke-width="5" marker-end="url(#a)"><path d="M610 95Q730 95 790 145"/><path d="M900 250v90"/><path d="M790 450q-60 55-170 70"/><path d="M380 520q-110-15-170-65"/><path d="M100 350v-90"/><path d="M210 145q65-55 170-65"/></g></svg>
