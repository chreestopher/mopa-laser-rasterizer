<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 390" role="img" aria-labelledby="title desc"><title id="title">MOPA Laser Rasterizer is a preparation assistant for Lightburn</title><desc id="desc">The application prepares artwork, layers, and settings; Lightburn remains the workspace for inspection, layout, device setup, framing, and laser operation.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3 0 6Z" fill="#8ee474"/></marker></defs><rect width="1100" height="390" rx="24" fill="#0e110e"/><g font-family="system-ui,sans-serif"><rect x="45" y="55" width="400" height="275" rx="18" fill="#1b211b" stroke="#61705e" stroke-width="3"/><rect x="655" y="55" width="400" height="275" rx="18" fill="#1b211b" stroke="#8b6f4b" stroke-width="3"/><text x="245" y="100" fill="#e4e3cf" font-size="28" font-weight="700" text-anchor="middle">Rasterizer prepares</text><text x="855" y="100" fill="#e4e3cf" font-size="28" font-weight="700" text-anchor="middle">Lightburn completes</text><g fill="#c8cbb9" font-size="21"><text x="90" y="150">✓ image reduction</text><text x="90" y="190">✓ closed vector geometry</text><text x="90" y="230">✓ color-layer separation</text><text x="90" y="270">✓ Material Library assignment</text><text x="700" y="150">✓ inspect and edit</text><text x="700" y="190">✓ arrange and frame</text><text x="700" y="230">✓ configure the device</text><text x="700" y="270">✓ operate the laser safely</text></g><path d="M465 195H630" fill="none" stroke="#8ee474" stroke-width="6" marker-end="url(#a)"/><text x="547" y="175" fill="#8ee474" font-size="19" text-anchor="middle">SVG + LBRN2</text><text x="550" y="365" fill="#b7b9a6" font-size="19" text-anchor="middle">A deliberate handoff: preparation assistant → production workspace</text></g></svg>
