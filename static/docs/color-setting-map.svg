<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 420" role="img" aria-labelledby="title desc">
  <title id="title">Mapping Rasterizer swatches to LightBurn Material Library descriptions</title><desc id="desc">Named palette swatches connect to matching description names in a Material Library and become recognizable LightBurn layers.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3 0 6Z" fill="#8ee474"/></marker></defs><rect width="1100" height="420" rx="24" fill="#0e110e"/>
  <g font-family="system-ui,sans-serif"><text x="180" y="55" fill="#e4e3cf" font-size="27" font-weight="700" text-anchor="middle">Editable swatches</text><text x="550" y="55" fill="#e4e3cf" font-size="27" font-weight="700" text-anchor="middle">Material Library</text><text x="920" y="55" fill="#e4e3cf" font-size="27" font-weight="700" text-anchor="middle">LightBurn layers</text>
    <g font-size="22" fill="#e4e3cf"><rect x="60" y="95" width="240" height="65" rx="10" fill="#321b1b" stroke="#d9534f" stroke-width="3"/><circle cx="95" cy="127" r="17" fill="#d9534f"/><text x="125" y="135">red</text><rect x="60" y="180" width="240" height="65" rx="10" fill="#17273a" stroke="#4a90e2" stroke-width="3"/><circle cx="95" cy="212" r="17" fill="#4a90e2"/><text x="125" y="220">blue</text><rect x="60" y="265" width="240" height="65" rx="10" fill="#363119" stroke="#f0c44c" stroke-width="3"/><circle cx="95" cy="297" r="17" fill="#f0c44c"/><text x="125" y="305">yellow</text></g>
    <g fill="#1b211b" stroke="#61705e" stroke-width="3"><rect x="400" y="95" width="300" height="65" rx="10"/><rect x="400" y="180" width="300" height="65" rx="10"/><rect x="400" y="265" width="300" height="65" rx="10"/></g><g fill="#d5d7c7" font-size="18"><text x="425" y="123">Description: red</text><text x="425" y="147">speed · power · frequency</text><text x="425" y="208">Description: blue</text><text x="425" y="232">speed · power · frequency</text><text x="425" y="293">Description: yellow</text><text x="425" y="317">speed · power · frequency</text></g>
    <g fill="none" stroke="#8ee474" stroke-width="4" marker-end="url(#arrow)"><path d="M305 127H390"/><path d="M305 212H390"/><path d="M305 297H390"/><path d="M705 127H790"/><path d="M705 212H790"/><path d="M705 297H790"/></g>
    <g fill="#1b211b" stroke-width="5"><rect x="800" y="95" width="240" height="65" rx="10" stroke="#d9534f"/><rect x="800" y="180" width="240" height="65" rx="10" stroke="#4a90e2"/><rect x="800" y="265" width="240" height="65" rx="10" stroke="#f0c44c"/></g><g fill="#e4e3cf" font-size="20"><text x="835" y="135">Red geometry</text><text x="835" y="220">Blue geometry</text><text x="835" y="305">Yellow geometry</text></g><text x="550" y="380" text-anchor="middle" fill="#b7b9a6" font-size="19">Consistent names make the automatic mapping easier for both the application and the operator to recognize.</text>
  </g>
</svg>
