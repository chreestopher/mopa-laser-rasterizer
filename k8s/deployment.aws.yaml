apiVersion: apps/v1
kind: Deployment
metadata:
  name: mopa-laser-rasterizer
  namespace: default
  labels:
    app: mopa-laser-rasterizer
    version: v1
spec:
  replicas: 3
  selector:
    matchLabels:
      app: mopa-laser-rasterizer
  template:
    metadata:
      labels:
        app: mopa-laser-rasterizer
    spec:
      imagePullSecrets:
      - name: ecr-registry
      # --- NEW: This blocks the Flask container until Redis is fully running ---
      initContainers:
      - name: wait-for-redis
        image: alpine:latest
        imagePullPolicy: IfNotPresent
        command: ["sh", "-c", "until nc -zvw1 redis-service 6379; do echo waiting for redis; sleep 2; done;"]
      
      containers:
      - name: mopa-laser-rasterizer
        image: mopa-laser-rasterizer:com
        imagePullPolicy: IfNotPresent
        env:
        - name: REDIS_HOST
          value: "redis-service"
        - name: REDIS_PORT
          value: "6379"
        - name: AWS_REGION
          value: "__AWS_REGION__"
        - name: S3_BUCKET_NAME
          value: "__S3_BUCKET_NAME__"
        - name: DYNAMODB_TABLE_NAME
          value: "__DYNAMODB_TABLE_NAME__"
        - name: UPLOAD_FOLDER
          value: "/tmp/uploads"
        - name: DAILY_JOB_LIMIT
          value: "3"
        - name: RASTER_JOB_QUEUE_ENABLED
          value: "true"
        - name: FARGATE_DISPATCH_VIA_S3
          value: "true"
        - name: SESSION_COOKIE_SECURE
          value: "true"
        - name: APP_SESSION_SECRET
          valueFrom:
            secretKeyRef:
              name: mopa-rasterizer-session
              key: secret
        - name: COMMUNITY_CONTRIBUTOR_SECRET
          valueFrom:
            secretKeyRef:
              name: mopa-rasterizer-session
              key: secret
        # Default-deny administrator identity. The Secret is created outside
        # source control by dev_setup/configure-k3s-admin.sh.
        - name: ADMIN_EMAIL
          valueFrom:
            secretKeyRef:
              name: mopa-rasterizer-admin
              key: ADMIN_EMAIL
              optional: true
        - name: COGNITO_POOL_ID
          value: "__COGNITO_POOL_ID__"
        # Fill COGNITO_CLIENT_ID with the non-secret app-client ID created for
        # the ALB.  It is used only to build Cognito's hosted-UI logout URL.
        - name: COGNITO_DOMAIN
          value: "__COGNITO_DOMAIN__"
        - name: COGNITO_CLIENT_ID
          value: "__COGNITO_CLIENT_ID__"
        - name: PUBLIC_APP_URL
          value: "https://www.mopa-laser-rasterizer.com"
        ports:
        - name: http
          containerPort: 8000
          protocol: TCP
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "4096Mi"
            cpu: "500m"
        volumeMounts:
        - name: job-scratch
          mountPath: /tmp/uploads
      volumes:
      - name: job-scratch
        emptyDir: {}
