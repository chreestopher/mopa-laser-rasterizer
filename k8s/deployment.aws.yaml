apiVersion: apps/v1
kind: Deployment
metadata:
  name: mopa-laser-rasterizer
  namespace: default
  labels:
    app: mopa-laser-rasterizer
    version: v1
spec:
  replicas: 3
  selector:
    matchLabels:
      app: mopa-laser-rasterizer
  template:
    metadata:
      labels:
        app: mopa-laser-rasterizer
    spec:
      # hostPath is local to a Kubernetes node. Label exactly the EC2 node that
      # contains /home/ubuntu/mopa-laser-rasterizer so every replica mounts the
      # same checked-out repository rather than a node-local copy.
      nodeSelector:
        mopa-laser-rasterizer-host: "true"
      # --- NEW: This blocks the Flask container until Redis is fully running ---
      initContainers:
      - name: wait-for-redis
        image: alpine:latest
        command: ["sh", "-c", "until nc -zvw1 redis-service 6379; do echo waiting for redis; sleep 2; done;"]
      
      containers:
      - name: mopa-laser-rasterizer
        image: mopa-laser-rasterizer:com
        imagePullPolicy: IfNotPresent
        env:
        - name: REDIS_HOST
          value: "redis-service"
        - name: REDIS_PORT
          value: "6379"
        - name: AWS_REGION
          value: "us-east-2"
        - name: S3_BUCKET_NAME
          value: "mopa-laser-rasterizer-artifacts-401716294893"
        - name: DYNAMODB_TABLE_NAME
          value: "mopa-laser-rasterizer-users"
        - name: UPLOAD_FOLDER
          value: "/tmp/uploads"
        - name: DAILY_JOB_LIMIT
          value: "3"
        - name: RASTER_JOB_QUEUE_ENABLED
          value: "true"
        - name: SESSION_COOKIE_SECURE
          value: "true"
        - name: APP_SESSION_SECRET
          valueFrom:
            secretKeyRef:
              name: mopa-rasterizer-session
              key: secret
        - name: COMMUNITY_CONTRIBUTOR_SECRET
          valueFrom:
            secretKeyRef:
              name: mopa-rasterizer-session
              key: secret
        # Fill COGNITO_CLIENT_ID with the non-secret app-client ID created for
        # the ALB.  It is used only to build Cognito's hosted-UI logout URL.
        - name: COGNITO_DOMAIN
          value: "mopa-laser-rasterizer-401716294893.auth.us-east-2.amazoncognito.com"
        - name: COGNITO_CLIENT_ID
          value: "69gif0iuklqcn0lldtn4sdtvat"
        - name: PUBLIC_APP_URL
          value: "https://www.mopa-laser-rasterizer.com"
        ports:
        - name: http
          containerPort: 8000
          protocol: TCP
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "4096Mi"
            cpu: "500m"
        volumeMounts:
        - name: application-source
          mountPath: /app
          readOnly: false
        - name: job-scratch
          mountPath: /tmp/uploads
      volumes:
      # This is a bind mount of the EC2 host checkout, not a copy into the pod.
      - name: application-source
        hostPath:
          path: /home/ubuntu/mopa-laser-rasterizer
          type: Directory
      - name: job-scratch
        emptyDir: {}
