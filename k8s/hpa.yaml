apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: mopa-laser-rasterizer
  namespace: default
  labels:
    app: mopa-laser-rasterizer
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: mopa-laser-rasterizer
  minReplicas: 2
  # Four web pods provide up to sixteen Gunicorn threads without allowing a
  # short submission burst to fill this two-node cluster with new containers.
  maxReplicas: 4
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        # Use an absolute target instead of a percentage of the deliberately
        # small CPU request. With a 100m request, the former 70% target treated
        # only 70m as overload and caused a 2 -> 3 -> 6 -> 9 replica storm.
        type: AverageValue
        averageValue: 200m
  - type: Resource
    resource:
      name: memory
      target:
        type: AverageValue
        averageValue: 384Mi
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
    scaleUp:
      # Require sustained pressure before adding capacity. Raster job
      # submission and pod initialization both create short CPU spikes that
      # should not trigger repeated doubling.
      stabilizationWindowSeconds: 60
      policies:
      - type: Pods
        value: 1
        periodSeconds: 60
      selectPolicy: Max
