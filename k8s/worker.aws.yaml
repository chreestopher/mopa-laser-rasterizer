apiVersion: apps/v1
kind: Deployment
metadata:
  name: mopa-laser-raster-worker
  namespace: default
  labels:
    app: mopa-laser-raster-worker
spec:
  # Production jobs are dispatched through S3/SQS to one-shot Fargate tasks.
  # Raise this only for an intentional Redis-queue rollback.
  replicas: 0
  progressDeadlineSeconds: 7500
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: mopa-laser-raster-worker
  template:
    metadata:
      labels:
        app: mopa-laser-raster-worker
    spec:
      nodeSelector:
        rasterizer.mopa/workload: worker
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                app: mopa-laser-raster-worker
            topologyKey: kubernetes.io/hostname
      terminationGracePeriodSeconds: 7200
      imagePullSecrets:
      - name: ecr-registry
      initContainers:
      - name: wait-for-redis
        image: alpine:latest
        imagePullPolicy: IfNotPresent
        command: ["sh", "-c", "until nc -zvw1 redis-service 6379; do echo waiting for redis; sleep 2; done;"]
      containers:
      - name: raster-worker
        image: mopa-laser-rasterizer:com
        imagePullPolicy: IfNotPresent
        command: ["python", "-u", "worker.py"]
        env:
        - name: REDIS_HOST
          value: "redis-service"
        - name: REDIS_PORT
          value: "6379"
        - name: AWS_REGION
          value: "__AWS_REGION__"
        - name: S3_BUCKET_NAME
          value: "__S3_BUCKET_NAME__"
        - name: DYNAMODB_TABLE_NAME
          value: "__DYNAMODB_TABLE_NAME__"
        - name: UPLOAD_FOLDER
          value: "/tmp/uploads"
        - name: RASTER_JOB_LEASE_SECONDS
          value: "90"
        - name: RASTER_JOB_HEARTBEAT_SECONDS
          value: "20"
        - name: RASTER_JOB_RECOVERY_INTERVAL_SECONDS
          value: "15"
        - name: RASTER_JOB_RECOVERY_LOCK_SECONDS
          value: "10"
        resources:
          requests:
            # Match observed production usage so the scheduler reserves enough
            # capacity for a CPU-bound worker and its typical working set.
            memory: "1536Mi"
            cpu: "1000m"
          limits:
            memory: "4096Mi"
            cpu: "1000m"
        volumeMounts:
        - name: job-scratch
          mountPath: /tmp/uploads
      volumes:
      - name: job-scratch
        emptyDir: {}
