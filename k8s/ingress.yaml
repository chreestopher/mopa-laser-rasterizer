apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mopa-laser-rasterizer
  namespace: default
  labels:
    app: mopa-laser-rasterizer
  annotations:
    kubernetes.io/ingress.class: traefik
    cert-manager.io/cluster-issuer: letsencrypt-prod
    # Allow larger uploads and disable upstream buffering where supported.
    # NGINX ingress controller annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
    nginx.ingress.kubernetes.io/proxy-request-buffering: "off"
    # Traefik (best-effort; Traefik may require different config depending on version):
    traefik.ingress.kubernetes.io/proxy-buffering: "off"
    
spec:
  ingressClassName: traefik
  tls:
  - hosts:
    - mopa-laser-rasterizer.local
    secretName: mopa-laser-rasterizer-tls
  rules:
  - host: mopa-laser-rasterizer.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: mopa-laser-rasterizer
            port:
              number: 80
