apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cgi-server
  namespace: default
  labels:
    app: cgi-server
  annotations:
    kubernetes.io/ingress.class: traefik
    cert-manager.io/cluster-issuer: letsencrypt-prod
    # Allow larger uploads and disable upstream buffering where supported.
    # NGINX ingress controller annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
    nginx.ingress.kubernetes.io/proxy-request-buffering: "off"
    # Traefik (best-effort; Traefik may require different config depending on version):
    traefik.ingress.kubernetes.io/proxy-buffering: "off"
spec:
  ingressClassName: traefik
  tls:
  - hosts:
    - cgi-server.local
    secretName: cgi-server-tls
  rules:
  - host: cgi-server.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: cgi-server
            port:
              number: 80
