name: Deploy serverless production

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: serverless-production-deployment
  cancel-in-progress: false

jobs:
  test-and-deploy:
    name: Test and deploy production
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment:
      name: serverless-production
      url: https://mopa-laser-rasterizer.com/
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-2' }}
      COGNITO_POOL_ID: ${{ vars.COGNITO_POOL_ID }}
      COGNITO_DOMAIN: ${{ vars.COGNITO_DOMAIN }}
      IDENTITY_CENTER_ADMIN_EMAIL: ${{ vars.IDENTITY_CENTER_ADMIN_EMAIL }}
      S3_BUCKET_NAME: ${{ vars.S3_BUCKET_NAME }}
      DYNAMODB_TABLE_NAME: ${{ vars.DYNAMODB_TABLE_NAME }}
      SERVERLESS_PRODUCTION_CERTIFICATE_ARN: ${{ vars.SERVERLESS_PRODUCTION_CERTIFICATE_ARN }}
      SERVERLESS_PRODUCTION_USE_CLOUDFRONT_CALLBACK: ${{ vars.SERVERLESS_PRODUCTION_USE_CLOUDFRONT_CALLBACK || 'false' }}
      SERVERLESS_PRODUCTION_RELEASE_COMMIT: ${{ github.sha }}
      ECR_REPOSITORY: mopa-laser-rasterizer
      COGNITO_UPDATE_DOMAIN: "false"
      COGNITO_APPLY_PRODUCTION_BRANDING: "false"
      COGNITO_APPLY_STAGING_BRANDING: "false"

    steps:
      - name: Check out promoted revision
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install --yes libagg-dev libpotrace-dev pkg-config

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt

      - name: Validate deployment scripts
        run: >-
          bash -n
          dev_setup/load-aws-env.sh
          dev_setup/serverless-production-guard.sh
          dev_setup/deploy_serverless_staging.sh
          dev_setup/deploy_serverless_staging_web.sh
          dev_setup/deploy_serverless_production.sh
          dev_setup/deploy_serverless_production_web.sh
          dev_setup/deploy_serverless_production_release.sh

      - name: Run regression tests
        run: python -m unittest discover -s tests

      - name: Configure short-lived AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.4
        with:
          role-to-assume: ${{ vars.AWS_PRODUCTION_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: github-production-deploy-${{ github.run_id }}
          allowed-account-ids: "401716294893"

      - name: Verify production deployment identity
        run: |
          set -euo pipefail
          test -n "${{ vars.AWS_PRODUCTION_DEPLOY_ROLE_ARN }}"
          aws sts get-caller-identity

      - name: Build and publish immutable worker image
        run: |
          set -euo pipefail
          ACCOUNT_ID="$(aws sts get-caller-identity --query Account --output text)"
          REGISTRY="${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          TAG="production-${GITHUB_SHA:0:20}"
          TAGGED_URI="${REGISTRY}/${ECR_REPOSITORY}:${TAG}"
          aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$REGISTRY"
          docker build --pull --tag "$TAGGED_URI" .
          docker push "$TAGGED_URI"
          DIGEST="$(aws ecr describe-images --region "$AWS_REGION" --repository-name "$ECR_REPOSITORY" --image-ids "imageTag=$TAG" --query 'imageDetails[0].imageDigest' --output text)"
          test "${DIGEST#sha256:}" != "$DIGEST"
          echo "SERVERLESS_PRODUCTION_IMAGE_URI=${REGISTRY}/${ECR_REPOSITORY}@${DIGEST}" >> "$GITHUB_ENV"

      - name: Deploy promoted production release
        run: bash dev_setup/deploy_serverless_production_release.sh --apply

      - name: Verify production endpoint
        run: curl --fail --silent --show-error --head --max-time 30 https://mopa-laser-rasterizer.com/ >/dev/null
